syntax = "proto3";

// Consensus administration changes replicated mutable parameters. Upgrade
// every voter before enabling updates: an old follower cannot apply the new
// Raft command even though the protobuf extension is wire-compatible.
package arbiter;
option go_package = "github.com/sentioxyz/arbiter-proto/gen/pb;pb";

import "google/protobuf/empty.proto";
import "arbiter.proto";
import "replay.proto";
import "table_registry.proto";

// ConsensusMutableParams is a complete authority set and writer limit, not
// a patch. Bootstrap values remain the original trust root on every restart;
// current values change only through committed, signed transitions.
message ConsensusMutableParams {
  repeated string authority_addresses = 1;
  uint64 max_writers = 2;
  // 0 keeps artifact disposition (Raft tag 28) refused; 1 enables it. Monotone.
  uint32 artifact_disposition_capability = 3;
  // Set once by a signed update and then carried unchanged by every later
  // update; absent means the dynamic table registry is disabled.
  TableRegistryParams table_registry = 4;
  // Set once by a signed update, then carried by every update; raise-only.
  ClientLaneParams client_lanes = 5;
  // Set once by the signed-claims activation, then carried complete by every
  // update: append-only, sorted by indexer_id (housegate spec 2026-10-10 D3).
  repeated SIIndexerEntry si_indexers = 6;
  // Set by the signed-claims activation together with si_indexers, then
  // carried complete by every update; entries may be added and removed (D7).
  repeated VerifierEntry verifiers = 7;
  // The tracks activation (housegate spec 2026-10-10 §7.6): false until one
  // authority-signed update after the signed-claims activation sets it, then
  // carried by every update and never lowered.
  bool tracks_enabled = 8;
}

// ConsensusParamsUpdate is mirrored by arbiter-core's canonical signing type.
// Authority addresses are lowercase, sorted and deduplicated before hashing.
// authority_jws covers every field; it uses a dedicated versioned purpose
// and CanonicalDigest domain, never protobuf serialization.
message ConsensusParamsUpdate {
  string network_id = 1;
  string genesis_snapshot_id = 2;
  uint64 expected_epoch = 3;
  string previous_params_digest = 4;
  repeated string authority_addresses = 5;
  uint64 max_writers = 6;
  // CAS against the last issued promotion sequence. This also binds the
  // authorization epoch boundary retained in snapshot history.
  uint64 expected_promotion_seq = 7;
  // Governs the C1 artifact-disposition lane; 0 or 1, never lowered.
  uint32 artifact_disposition_capability = 8;
  // Absent keeps the registry disabled. Once set it must be resent unchanged.
  TableRegistryParams table_registry = 9;
  // Absent keeps client lanes disabled. Once set it must be resent; lowering or removal is refused.
  ClientLaneParams client_lanes = 10;
  // Enrolled SI indexers (housegate spec 2026-10-10 D3, §6.1), sorted by
  // indexer_id. Empty keeps signed claims inactive. The update that first sets
  // it is the irreversible signed-claims activation (§6.7): it needs
  // table_registry (earlier or in the same update) and verifiers in the same
  // update, and its entry for table_registry.si_indexer_id restates the
  // founding indexer with table_registry.activation_block. In the same Apply
  // that first sets it, every registered, non-evicted SNODE whose node id no
  // entry names is evicted (reason "not named by the signed-claims
  // activation"), and a named SNode registered with any role other than
  // exactly SNODE refuses the update. Afterwards every update resends the complete list: entries are only appended (an
  // enrolment, §6.2), and an entry's signer changes only with a new
  // enrollment_jws. max_writers must be at least its length. It joins the
  // params digest only once set, so earlier digests are unchanged.
  repeated SIIndexerEntry si_indexers = 11;
  // The governed verifier set (D7), sorted by node_id. Empty until the
  // signed-claims activation, which lists at least three verifiers. In the same
  // Apply, every registered, non-evicted VERIFIER it does not list is evicted
  // (reason "not named by the signed-claims activation"), and a listed verifier
  // registered under a different ed25519 key refuses the update. Afterwards
  // every update resends the complete list; entries may be added and removed,
  // a removed verifier is evicted, and no update may leave fewer than three
  // non-evicted listed verifiers. It joins the params digest only once set.
  repeated VerifierEntry verifiers = 12;
  // The tracks activation (housegate spec 2026-10-10 §7): raise-only; once set
  // every update must carry it. Only an update after the one that first set
  // si_indexers may set it, never the signed-claims activation itself. The
  // update that first sets it is the irreversible tracks activation and the
  // first command to carry any stage-2 field: on top of the writer and drain
  // gates, Apply refuses it unless the open block is empty, every sealed block
  // is safe, the published manifest covers the sealed tip,
  // artifact_disposition_capability is 0 and the snapshot-query barrier is
  // idle, and applying it records the track cutover {sealed tip,
  // promotion_seq}. Every voter, verifier and SNode must advertise
  // "track_manifests_v1" first. It joins the params digest only once set, so
  // earlier digests are unchanged.
  bool tracks_enabled = 13;
}

// UpdateConsensusParamsCmd is both the administration request and the
// replicated command. Epoch, digest, and promotion-sequence preconditions
// are checked atomically by the FSM; consumed epochs are rejected on retry.
message UpdateConsensusParamsCmd {
  ConsensusParamsUpdate update = 1;
  string authority_jws = 2;
}

// Identity of one sequenced snapshot query whose consumed reservation an
// authority intends to abort. Version 1 uses keeper_shard_id 0.
message GetSnapshotQueryAbortCandidateRequest {
  string network_id = 1;
  uint32 keeper_shard_id = 2;
  string client_account = 3;
  string statement_id = 4;
}

// An authority-authenticated terminal abort of a sequenced snapshot query.
// The record must equal the replica-derived candidate except reason_code;
// never inferred from client cancellation or a local timeout.
message AbortSnapshotQueryRequest {
  SnapshotQueryAbortRecord record = 1;
  string authority_jws = 2;
}

// Authority-signed activation of a query profile for the current executor
// profile (Raft tag 23). Leader-only, explicitly enabled; refused by the FSM
// while the artifact disposition capability is enabled, where activation
// belongs to the candidate-bound publication.
message ActivateQueryProfileRequest {
  ActiveQueryPolicy activation = 1;
  string authority_jws = 2;
}

// ProtocolInfo describes the directly contacted node, including followers.
// protocol_version=1 supports the ConsensusAdmin service and update command.
message ProtocolInfo {
  string node_id = 1;
  uint32 protocol_version = 2;
  bool updates_enabled = 3;
  // Capability strings of this binary ("client_lanes_v1", "signed_claims_v1",
  // "track_manifests_v1"); a static local property, read by arbiter-admin's
  // activation gates on every voter.
  repeated string features = 4;
}

// ConsensusParamsState is a leader-barrier view used to prepare the next
// signed update or resolve the outcome of an uncertain previous request.
message ConsensusParamsState {
  uint32 protocol_version = 1;
  string network_id = 2;
  string genesis_snapshot_id = 3;
  ConsensusMutableParams bootstrap = 4;
  ConsensusMutableParams current = 5;
  uint64 epoch = 6;
  // Digest of the full current consensus parameters, including immutable
  // fields; this is not only a digest of ConsensusMutableParams.
  string params_digest = 7;
  uint64 promotion_seq = 8;
}

// NodeFeatureEntry joins one non-evicted verifier or SNode registration with
// the features its latest RegisterNode on the current leader advertised.
// features is empty when this leader has not seen it register.
message NodeFeatureEntry {
  string node_id = 1;
  repeated string features = 2;
  int64 registered_unix = 3;
}

// NodeFeatures is the leader's non-replicated feature book. raft_voter_ids is
// the current Raft configuration's voter ids, so the activation gate can prove
// it probed every voter.
message NodeFeatures {
  repeated NodeFeatureEntry entries = 1;
  repeated string raft_voter_ids = 2;
}

// VerifierEntry is one governed verifier (housegate spec 2026-10-10 D7).
// ed25519_pubkey is the raw 32-byte key the verifier registers as
// NodeRegistration.ed25519_pubkey and signs its evidence with; after the
// signed-claims activation it also signs the node's registration, activation
// and purge reports.
message VerifierEntry {
  string node_id = 1;
  bytes ed25519_pubkey = 2;
}

// EvictNodeRequest is the authority-signed eviction of one data-plane node
// (housegate spec 2026-10-10 §6.5). authority_jws is an ES256K JWS by a
// current authority address with purpose "arbiter-evict-node-v1" over the
// canonical digest of {node_id, expected_registration_seq, reason}, bound to
// the network id, genesis snapshot id and authority epoch.
// expected_registration_seq must equal the node's last applied
// registration_seq, so an eviction signed against one registration never
// evicts a later one.
message EvictNodeRequest {
  string node_id = 1;
  uint64 expected_registration_seq = 2;
  string reason = 3;
  string authority_jws = 4;
}

// QuarantineIndexerCmd is both the ConsensusAdmin request and the Raft
// command (the UpdateConsensusParamsCmd precedent). authority_jws is an
// ES256K JWS by a current authority address with purpose
// "arbiter-quarantine-indexer-v1" over the canonical digest of
// {indexer_id, expected_generation, reason}, bound to the network id,
// genesis snapshot id and authority epoch. expected_generation must equal the
// indexer's quarantine_generation, which every applied quarantine, release and
// automatic quarantine increments, so a replayed command is refused (housegate
// spec 2026-10-10 §7.4); reason is non-empty. Proposed only after the tracks
// activation, as Raft tag 36.
message QuarantineIndexerCmd {
  uint64 indexer_id = 1;
  uint64 expected_generation = 2;
  string reason = 3;
  string authority_jws = 4;
}

// ReleaseIndexerCmd: purpose "arbiter-release-indexer-v1" over
// {indexer_id, expected_generation, acknowledged_rejected_blocks}; the list
// is sorted ascending and unique, empty when there is nothing to acknowledge.
// It must equal the indexer's unacknowledged rejected blocks exactly
// (housegate spec 2026-10-10 §7.5); each then counts as passed for the track
// and its rejected candidate parts are cleaned up. The same context binding
// and generation rule as QuarantineIndexerCmd; proposed only after the tracks
// activation, as Raft tag 37.
message ReleaseIndexerCmd {
  uint64 indexer_id = 1;
  uint64 expected_generation = 2;
  repeated uint64 acknowledged_rejected_blocks = 3;
  string authority_jws = 4;
}

// IndexerTrackView is one enrolled SI indexer's track in committed state
// (housegate spec 2026-10-10 §7.2-§7.6).
message IndexerTrackView {
  uint64 indexer_id = 1;
  // The track's frontier before its first own block: the activation cutover,
  // or {global safe prefix, promotion_seq} at its enrolment commit for an
  // indexer enrolled after the activation.
  TrackFrontier initial = 2;
  // Starts at 0; every applied quarantine, release and automatic quarantine
  // increments it. The next QuarantineIndexerCmd or ReleaseIndexerCmd names
  // it as expected_generation.
  uint64 quarantine_generation = 3;
  bool quarantined = 4;
  string quarantine_reason = 5;
  // The track's rejected blocks no release has acknowledged yet, ascending;
  // a release must list exactly these.
  repeated uint64 rejected_blocks = 6;
  // The rejected blocks a release acknowledged, ascending; each counts as
  // passed for the track.
  repeated uint64 acknowledged_rejected_blocks = 7;
  // The track's current safe prefix.
  uint64 prefix_block_seq = 8;
  // The track's entry in the latest published manifest, or initial when that
  // manifest carries none.
  TrackFrontier published = 9;
}

// TrackStateView answers ConsensusAdmin.GetTrackState. Before the tracks
// activation tracks_enabled is false and every other field is empty.
message TrackStateView {
  bool tracks_enabled = 1;
  // The track cutover the activation recorded: the sealed tip and the
  // promotion sequence when it applied.
  uint64 cutover_block_seq = 2;
  uint64 cutover_promotion_seq = 3;
  // The contiguous safe prefix over all blocks.
  uint64 global_safe_block_seq = 4;
  // safe_block_seq of the latest published manifest.
  uint64 published_safe_block_seq = 5;
  repeated IndexerTrackView indexers = 6;   // sorted by indexer_id
}

service ConsensusAdmin {
  // Local static capability probe: no leader redirection or Raft barrier.
  rpc GetProtocolInfo (google.protobuf.Empty) returns (ProtocolInfo) {}
  // Leader-only read with a barrier; followers return NotLeader details.
  rpc GetConsensusParams (google.protobuf.Empty) returns (ConsensusParamsState) {}
  // Leader-only, explicitly enabled mutation. Ack means committed success;
  // unlike idempotent data-plane writes, a consumed epoch is an error.
  rpc UpdateConsensusParams (UpdateConsensusParamsCmd) returns (Ack) {}
  // Leader-only read with a barrier: the replica-derived abort record for the
  // consumed reservation of one account/statement, with reason_code and
  // cleanup_authorization_root left empty for the authority to fill and sign.
  // NotFound when that identity holds no consumed reservation.
  rpc GetSnapshotQueryAbortCandidate (GetSnapshotQueryAbortCandidateRequest) returns (SnapshotQueryAbortRecord) {}
  // Leader-only, authority-authenticated terminal abort; returns the terminal
  // status (lifecycle "terminal", execution_outcome "aborted", terminal_proof).
  rpc AbortSnapshotQuery (AbortSnapshotQueryRequest) returns (SnapshotQueryStatus) {}
  // Leader-only, explicitly enabled mutation: proposes Raft tag 23.
  rpc ActivateQueryProfile (ActivateQueryProfileRequest) returns (Ack) {}
  // Leader-only read with a barrier: one entry per non-evicted verifier and
  // SNode registration joined with the leader's non-replicated feature book.
  rpc GetNodeFeatures (google.protobuf.Empty) returns (NodeFeatures) {}
  // Leader-only, authority-authenticated eviction (housegate spec 2026-10-10
  // §6.5): proposes EvictNodeCmd carrying expected_registration_seq and
  // authority_jws. Refused with FAILED_PRECONDITION until the signed-claims
  // activation has committed, because no earlier command may carry those
  // fields. Ack means committed success.
  rpc EvictNode (EvictNodeRequest) returns (Ack) {}
  // Leader-only, authority-authenticated quarantine of one SI indexer
  // (housegate spec 2026-10-10 §7.4): proposes Raft tag 36. Refused with
  // FAILED_PRECONDITION until the tracks activation has committed, because no
  // earlier command may carry it. Ack means committed success.
  rpc QuarantineIndexer (QuarantineIndexerCmd) returns (Ack) {}
  // Leader-only, authority-authenticated release (housegate spec 2026-10-10
  // §7.4-§7.5): proposes Raft tag 37. FAILED_PRECONDITION before the tracks
  // activation. Ack means committed success.
  rpc ReleaseIndexer (ReleaseIndexerCmd) returns (Ack) {}
  // Leader-only read with a barrier; followers return NotLeader details.
  // Before the tracks activation it answers tracks_enabled false and no
  // indexers.
  rpc GetTrackState (google.protobuf.Empty) returns (TrackStateView) {}
}
