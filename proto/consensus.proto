syntax = "proto3";

// Consensus administration changes replicated mutable parameters. Upgrade
// every voter before enabling updates: an old follower cannot apply the new
// Raft command even though the protobuf extension is wire-compatible.
package arbiter;
option go_package = "github.com/sentioxyz/arbiter-proto/gen/pb;pb";

import "google/protobuf/empty.proto";
import "arbiter.proto";
import "replay.proto";
import "table_registry.proto";

// ConsensusMutableParams is a complete authority set and writer limit, not
// a patch. Bootstrap values remain the original trust root on every restart;
// current values change only through committed, signed transitions.
message ConsensusMutableParams {
  repeated string authority_addresses = 1;
  uint64 max_writers = 2;
  // 0 keeps artifact disposition (Raft tag 28) refused; 1 enables it. Monotone.
  uint32 artifact_disposition_capability = 3;
  // Set once by a signed update and then carried unchanged by every later
  // update; absent means the dynamic table registry is disabled.
  TableRegistryParams table_registry = 4;
  // Set once by a signed update, then carried by every update; raise-only.
  ClientLaneParams client_lanes = 5;
  // Set once by the signed-claims activation, then carried complete by every
  // update: append-only, sorted by indexer_id (housegate spec 2026-10-10 D3).
  repeated SIIndexerEntry si_indexers = 6;
  // Set by the signed-claims activation together with si_indexers, then
  // carried complete by every update; entries may be added and removed (D7).
  repeated VerifierEntry verifiers = 7;
  // The tracks activation (housegate spec 2026-10-10 §7.6): false until one
  // authority-signed update after the signed-claims activation sets it, then
  // carried by every update and never lowered.
  bool tracks_enabled = 8;
  // The stage-3 parameter (housegate spec 2026-10-14 §6.1, §10.4): absent until
  // the v21 activation; then carried complete by every update.
  Stage3Params stage3 = 9;
  // The promotion finality gate: false until one authority-signed update after
  // the tracks activation sets it, then carried by every update and never
  // lowered.
  bool promotion_finality_gate = 10;
  // The manifest delta snapshot: false until one authority-signed update after
  // the stage-3 activation sets it, then carried by every update and never
  // lowered.
  bool manifest_delta_snapshot = 11;
  // The table admission rules version: 0 (rules v1) until one authority-signed
  // update after the table registry activation raises it, then carried by
  // every update and never lowered.
  uint32 table_admission_rules_version = 12;
  // The part-claim uniqueness gate: false until one authority-signed update
  // after the tracks activation sets it, then carried by every update and
  // never lowered.
  bool part_claim_uniqueness = 13;
  // The enrolled Raft voters and their ed25519 keys: absent until an
  // authority-signed update sets it; once anchor_finality is set, carried
  // complete and non-empty by every update.
  repeated VoterEntry voters = 14;
  // The anchor finality quorum: absent until one authority-signed update sets
  // it with voters, then carried by every update; only quorum may change.
  AnchorFinalityParams anchor_finality = 15;
  // The governance authority threshold k: 0 until an authority-signed update
  // sets it (effective k is then 1), afterwards carried non-zero by every
  // update.
  uint32 authority_threshold = 16;
  // The membership lease in L2 blocks: 0 until one authority-signed update
  // after the table registry activation sets it, then carried non-zero by
  // every update.
  uint64 membership_lease_l2_blocks = 17;
  // The promotion acknowledgement delta snapshot: false until one
  // authority-signed update after manifest_delta_snapshot sets it, then
  // carried by every update and never lowered.
  bool promotion_ack_delta_snapshot = 18;
  // The track-aware snapshot-query lane: false until one authority-signed
  // update after the tracks activation and promotion_ack_delta_snapshot sets
  // it, then carried by every update and never lowered.
  bool snapshot_query_tracks = 19;
}

// ConsensusParamsUpdate is mirrored by arbiter-core's canonical signing type.
// Authority addresses are lowercase, sorted and deduplicated before hashing.
// authority_jws covers every field; it uses a dedicated versioned purpose
// and CanonicalDigest domain, never protobuf serialization.
message ConsensusParamsUpdate {
  string network_id = 1;
  string genesis_snapshot_id = 2;
  uint64 expected_epoch = 3;
  string previous_params_digest = 4;
  repeated string authority_addresses = 5;
  uint64 max_writers = 6;
  // CAS against the last issued promotion sequence. This also binds the
  // authorization epoch boundary retained in snapshot history.
  uint64 expected_promotion_seq = 7;
  // Governs the C1 artifact-disposition lane; 0 or 1, never lowered.
  uint32 artifact_disposition_capability = 8;
  // Absent keeps the registry disabled. Once set it must be resent unchanged.
  TableRegistryParams table_registry = 9;
  // Absent keeps client lanes disabled. Once set it must be resent; lowering or removal is refused.
  ClientLaneParams client_lanes = 10;
  // Enrolled SI indexers (housegate spec 2026-10-10 D3, §6.1), sorted by
  // indexer_id. Empty keeps signed claims inactive. The update that first sets
  // it is the irreversible signed-claims activation (§6.7): it needs
  // table_registry (earlier or in the same update) and verifiers in the same
  // update, and its entry for table_registry.si_indexer_id restates the
  // founding indexer with table_registry.activation_block. In the same Apply
  // that first sets it, every registered, non-evicted SNODE whose node id no
  // entry names is evicted (reason "not named by the signed-claims
  // activation"), and a named SNode registered with any role other than
  // exactly SNODE refuses the update. Afterwards every update resends the complete list: entries are only appended (an
  // enrolment, §6.2), and an entry's signer changes only with a new
  // enrollment_jws. max_writers must be at least its length. It joins the
  // params digest only once set, so earlier digests are unchanged.
  repeated SIIndexerEntry si_indexers = 11;
  // The governed verifier set (D7), sorted by node_id. Empty until the
  // signed-claims activation, which lists at least three verifiers. In the same
  // Apply, every registered, non-evicted VERIFIER it does not list is evicted
  // (reason "not named by the signed-claims activation"), and a listed verifier
  // registered under a different ed25519 key refuses the update. Afterwards
  // every update resends the complete list; entries may be added and removed,
  // a removed verifier is evicted, and no update may leave fewer than three
  // non-evicted listed verifiers. It joins the params digest only once set.
  repeated VerifierEntry verifiers = 12;
  // The tracks activation (housegate spec 2026-10-10 §7): raise-only; once set
  // every update must carry it. Only an update after the one that first set
  // si_indexers may set it, never the signed-claims activation itself. The
  // update that first sets it is the irreversible tracks activation and the
  // first command to carry any stage-2 field: on top of the writer and drain
  // gates, Apply refuses it unless the open block is empty, every sealed block
  // is safe, the published manifest covers the sealed tip,
  // artifact_disposition_capability is 0 and the snapshot-query barrier is
  // idle, and applying it records the track cutover {sealed tip,
  // promotion_seq}. Every voter, verifier and SNode must advertise
  // "track_manifests_v1" first. It joins the params digest only once set, so
  // earlier digests are unchanged.
  bool tracks_enabled = 13;
  // The stage-3 parameter (housegate spec 2026-10-14 §6.1, §10.3-§10.4).
  // Absent keeps stage 3 inactive. The update that first sets it is the
  // irreversible v21 activation: it needs tracks_enabled, sets every switch
  // false, and is refused unless every voter and every registered, non-evicted
  // data-plane node not on a quarantined track advertises "stage3_v1"; snapshots
  // are written as v21 from its commit on. Afterwards every update carries it.
  // It joins the params digest only once set, so earlier digests are unchanged.
  Stage3Params stage3 = 14;
  // The promotion finality gate: raise-only; once set every update must carry
  // it, and it needs tracks_enabled (earlier or in the same update). While it
  // is set, RecordPromotionIssued is refused when any statement the promotion
  // covers is not Promotable, that is quorum-verified with its block's anchor
  // final and last-mergeable. Before it the gate lives only in the leader's
  // work set and the authority signature. It changes Apply, so every voter
  // must run a binary that knows the field before an update sets it. It joins
  // the params digest only once set, so earlier digests are unchanged.
  bool promotion_finality_gate = 15;
  // The manifest delta snapshot: raise-only; once set every update must carry
  // it, and it needs stage3 (earlier or in the same update). From its commit
  // on, snapshots are written as v22, which stores every published manifest
  // other than the genesis and the safe watermark's as a delta against its
  // parent. It changes no Apply rule, but an older binary cannot read v22, so
  // every voter must run a binary that knows the field before an update sets
  // it. It joins the params digest only once set, so earlier digests are
  // unchanged.
  bool manifest_delta_snapshot = 16;
  // The table admission rules version every later AddTable is judged by: 0
  // means admission rules v1 (the only rules before the field existed); 2
  // selects admission rules v2, which admits a wider column-type set (Date32,
  // UUID, the 128- and 256-bit integers, LowCardinality(String) and
  // Nullable over a plain scalar). Raise-only; once set every update must
  // carry it, and it needs the table registry (earlier or in the same update).
  // An AddTable is judged by the version in force when it commits, so tables
  // admitted before the raise keep their verdicts on replay. It changes Apply,
  // so every voter must run a binary that knows the field before an update
  // sets it, and every SNode and verifier must run a profile that replays the
  // wider types. It joins the params digest only once set, so earlier digests
  // are unchanged.
  uint32 table_admission_rules_version = 17;
  // The part-claim uniqueness gate. Once committed, Apply refuses a result
  // claim whose candidate parts name one (table, partition, part hash) twice
  // or one that another statement's bound or parked claim names, and the
  // acknowledged cleanup of a rejected partition removes the Rejected
  // statements' parts in it from coverage, so a cleaned Rejected statement no
  // longer pins an earlier block that shares a part hash. Raise-only; once set
  // every update must carry it, and it needs tracks_enabled in the same
  // update. It changes Apply, so every voter must run a binary that knows the
  // field before an update sets it. It joins the params digest only once set,
  // so earlier digests are unchanged.
  bool part_claim_uniqueness = 18;
  // The enrolled Raft voters (sorted by voter_id; ids and keys unique). Each
  // voter_id is the voter's Raft server id and each entry's consent_sig is
  // that key's own signature over the entry. The set may change from update to
  // update; once anchor_finality is committed every update must carry a
  // non-empty set. Absent from the params digest while empty.
  repeated VoterEntry voters = 19;
  // The anchor finality quorum. Once committed, a block's anchor finality and
  // last-mergeable flags latch only with signed attestations
  // (RecordAnchorFinalityAttestationCmd) from at least quorum distinct
  // enrolled voters, judged under this policy against this chain and
  // registry contract; RecordAnchorFinalityCmd then only records the anchor
  // ref. The first update that sets it needs voters in the same update and
  // promotion_finality_gate committed or set in the same update; afterwards
  // every update carries it, quorum stays a majority of voters, and every
  // other field is immutable. It changes Apply and adds Raft tag 43, so every
  // voter must run a binary that knows both first. Absent from the params
  // digest while unset.
  AnchorFinalityParams anchor_finality = 20;
  // The governance authority threshold k (k-of-n). 0 means never set, and the
  // effective threshold is then 1: any single member of the authority set
  // authorizes, as before the field existed. Once committed non-zero, every
  // governance command (consensus updates, query-profile activation, node
  // eviction, indexer quarantine and release, track settle, group rebalance,
  // snapshot-query abort) needs authority_jws signatures from at least k
  // distinct members of the current set; operational commands the leader
  // signs automatically (promotion, cleanup, member lagging, verifier
  // reselection) stay single-signature. A multi-signature authority_jws is
  // two or more compact JWS joined by "~", ordered by strictly ascending
  // recovered signer address (lowercase 0x hex); with k = 1 only a single
  // compact JWS is accepted. This update itself is authorized by the k in
  // force before it, so raising and lowering both need the old k. It must
  // not exceed the number of authority_addresses of this update, and once set
  // every update must carry a non-zero value. It changes Apply, so every
  // voter must run a binary that knows the field before an update sets it.
  // It joins the params digest only once set, so earlier digests are
  // unchanged.
  uint32 authority_threshold = 21;
  // The membership lease, in L2 blocks of the committed table registry
  // cursor. 0 means no lease: an Active node stays Active until it
  // re-registers or is evicted, as before the field existed. Once committed
  // non-zero, every Active node renews its lease with RenewNodeLeaseCmd (Raft
  // tag 44), and an Active node whose last renewal or MarkActive is at least
  // this many L2 blocks behind the committed cursor becomes Syncing in the
  // Apply that advances the cursor: the transition a re-registration without
  // MarkActive makes (not eviction), so its bound statements keep their
  // source and it returns with MarkActive at its current registration_seq.
  // The update that sets it restarts every Active node's lease at the
  // committed cursor. Expiry advances only with the cursor, so it stops while
  // the registry watcher stops (fail-safe: nothing expires). The lease must be
  // far longer than the nodes' renewal interval expressed in L2 blocks; the
  // canonical normalizer refuses a lease below a fixed floor. It needs the
  // table registry (earlier or in the same update); once set every update
  // must carry a non-zero value. It changes Apply and adds Raft tag 44, so
  // every voter must run a binary that knows both, and every data-plane node
  // one that renews, before an update sets it. It joins the params digest
  // only once set, so earlier digests are unchanged.
  uint64 membership_lease_l2_blocks = 22;
  // The promotion acknowledgement delta snapshot: raise-only; once set every
  // update must carry it, and it needs manifest_delta_snapshot (earlier or in
  // the same update). From its commit on, snapshots are written as v23, which
  // stores the complete safe-partition inventory of every acknowledged
  // promotion as a delta against the previous acknowledgement of its
  // partition. It changes no Apply rule, but an older binary cannot read v23,
  // so every voter must run a binary that knows the field before an update
  // sets it. It joins the params digest only once set, so earlier digests are
  // unchanged.
  bool promotion_ack_delta_snapshot = 23;
  // The track-aware snapshot-query lane (internal design doc
  // 2026-11-11-track-aware-snapshot-query-design): raise-only; once set every
  // update must carry it. It needs tracks_enabled committed by an earlier
  // update and promotion_ack_delta_snapshot (earlier or in the same update).
  // While it is set BeginSnapshotQuery is accepted on a network with tracks:
  // the query belongs to the owner track of its target table, only that
  // track's admission is fenced, and control tokens use purpose
  // housegate-snapshot-query-control-v2 with target_table_id. From its commit
  // on, snapshots are written as v24, so every voter must run a binary that
  // knows the field before an update sets it. It joins the params digest only
  // once set, so earlier digests are unchanged.
  bool snapshot_query_tracks = 24;
}

// VoterEntry is one enrolled Raft voter. consent_sig is lowercase hex of the
// ed25519 signature, by ed25519_pubkey, over the voter message hash of kind
// "consent" with body {voter_id, ed25519_pubkey} in the network's message
// context: proof that the key's holder agreed to this enrolment.
message VoterEntry {
  string voter_id = 1;
  bytes ed25519_pubkey = 2;
  string consent_sig = 3;
}

// AnchorFinalityParams is the anchor finality quorum and the policy every
// voter judges by. finality_mode is "finalized" or "safe" (the L2 block tag
// must have reached the anchor's entry block) or "confirmations" (the entry
// block has finality_confirmations confirmations, which must be positive).
// Last-mergeable additionally needs last_mergeable_confirmations more
// confirmations in "confirmations" mode, or that many confirmations in total
// in the tag modes. registry_contract is the anchor registry, lowercase 0x +
// 40 hex, on the chain l2_chain_id (positive). quorum is a majority of the
// enrolled voters: len(voters) / 2 < quorum <= len(voters).
message AnchorFinalityParams {
  uint32 quorum = 1;
  string finality_mode = 2;
  uint64 finality_confirmations = 3;
  uint64 last_mergeable_confirmations = 4;
  uint64 l2_chain_id = 5;
  string registry_contract = 6;
}

// UpdateConsensusParamsCmd is both the administration request and the
// replicated command. Epoch, digest, and promotion-sequence preconditions
// are checked atomically by the FSM; consumed epochs are rejected on retry.
message UpdateConsensusParamsCmd {
  ConsensusParamsUpdate update = 1;
  string authority_jws = 2;
}

// Identity of one sequenced snapshot query whose consumed reservation an
// authority intends to abort. Version 1 uses keeper_shard_id 0.
message GetSnapshotQueryAbortCandidateRequest {
  string network_id = 1;
  uint32 keeper_shard_id = 2;
  string client_account = 3;
  string statement_id = 4;
}

// An authority-authenticated terminal abort of a sequenced snapshot query.
// The record must equal the replica-derived candidate except reason_code;
// never inferred from client cancellation or a local timeout.
message AbortSnapshotQueryRequest {
  SnapshotQueryAbortRecord record = 1;
  string authority_jws = 2;
}

// Authority-signed activation of a query profile for the current executor
// profile (Raft tag 23). Leader-only, explicitly enabled; refused by the FSM
// while the artifact disposition capability is enabled, where activation
// belongs to the candidate-bound publication.
message ActivateQueryProfileRequest {
  ActiveQueryPolicy activation = 1;
  string authority_jws = 2;
}

// ProtocolInfo describes the directly contacted node, including followers.
// protocol_version=1 supports the ConsensusAdmin service and update command.
message ProtocolInfo {
  string node_id = 1;
  uint32 protocol_version = 2;
  bool updates_enabled = 3;
  // Capability strings of this binary ("client_lanes_v1", "signed_claims_v1",
  // "track_manifests_v1"); a static local property, read by arbiter-admin's
  // activation gates on every voter.
  repeated string features = 4;
  // The ed25519 public key this voter signs voter messages with, empty when
  // none is configured; read by the anchor finality activation gate, which
  // requires it to equal the key the voter's VoterEntry enrols.
  bytes voter_ed25519_pubkey = 5;
}

// ConsensusParamsState is a leader-barrier view used to prepare the next
// signed update or resolve the outcome of an uncertain previous request.
message ConsensusParamsState {
  uint32 protocol_version = 1;
  string network_id = 2;
  string genesis_snapshot_id = 3;
  ConsensusMutableParams bootstrap = 4;
  ConsensusMutableParams current = 5;
  uint64 epoch = 6;
  // Digest of the full current consensus parameters, including immutable
  // fields; this is not only a digest of ConsensusMutableParams.
  string params_digest = 7;
  uint64 promotion_seq = 8;
  // The v21 activation and switch cutovers (plan S3-E1 K64); absent before the
  // activation.
  Stage3StateView stage3_state = 9;
  // The network's immutable schema and executor identity, the two fields
  // besides network_id that the immutable consensus digest binds. They never
  // change after genesis; servers before these fields leave them empty.
  string schema_snapshot_id = 10;
  string executor_profile_id = 11;
}

// NodeFeatureEntry joins one non-evicted verifier or SNode registration with
// the features its latest RegisterNode on the current leader advertised.
// features is empty when this leader has not seen it register.
message NodeFeatureEntry {
  string node_id = 1;
  repeated string features = 2;
  int64 registered_unix = 3;
}

// NodeFeatures is the leader's non-replicated feature book. raft_voter_ids is
// the current Raft configuration's voter ids, so the activation gate can prove
// it probed every voter.
message NodeFeatures {
  repeated NodeFeatureEntry entries = 1;
  repeated string raft_voter_ids = 2;
}

// VerifierEntry is one governed verifier (housegate spec 2026-10-10 D7).
// ed25519_pubkey is the raw 32-byte key the verifier registers as
// NodeRegistration.ed25519_pubkey and signs its evidence with; after the
// signed-claims activation it also signs the node's registration, activation
// and purge reports.
// Stage 3 (housegate spec 2026-10-14 §6.1): an entry without host_indexer_id
// is a network-pool verifier: fields 4-11 must then be unset, so its bytes and
// digest are those of arbiter-proto v0.11.0. An entry with host_indexer_id is
// a member: every field is explicit (plan S3-E1 K58), weight is 1-64,
// failure_domain equals stage3.indexer_failure_domains[host_indexer_id],
// consent_jws is the ES256K JWS of si_indexers[host_indexer_id].signer with
// purpose "arbiter-group-member-v1" over {network_id, genesis_snapshot_id,
// host_indexer_id, node_id, ed25519_pubkey, replica_signer}, and
// shared_rmt=false with verify=true is refused.
message VerifierEntry {
  string node_id = 1;
  bytes ed25519_pubkey = 2;
  // optional because indexer 0 is a valid host.
  optional uint64 host_indexer_id = 3;
  // Lowercase 0x + 40 hex: signs this member's checkpoints.
  string replica_signer = 4;
  string consent_jws = 5;
  uint32 weight = 6;
  string failure_domain = 7;
  bool verify = 8;
  bool replicate = 9;
  bool counts = 10;
  bool shared_rmt = 11;
}

// EvictNodeRequest is the authority-signed eviction of one data-plane node
// (housegate spec 2026-10-10 §6.5). authority_jws is an ES256K JWS by a
// current authority address with purpose "arbiter-evict-node-v1" over the
// canonical digest of {node_id, expected_registration_seq, reason}, bound to
// the network id, genesis snapshot id and authority epoch.
// expected_registration_seq must equal the node's last applied
// registration_seq, so an eviction signed against one registration never
// evicts a later one.
message EvictNodeRequest {
  string node_id = 1;
  uint64 expected_registration_seq = 2;
  string reason = 3;
  string authority_jws = 4;
}

// QuarantineIndexerCmd is both the ConsensusAdmin request and the Raft
// command (the UpdateConsensusParamsCmd precedent). authority_jws is an
// ES256K JWS by a current authority address with purpose
// "arbiter-quarantine-indexer-v1" over the canonical digest of
// {indexer_id, expected_generation, reason}, bound to the network id,
// genesis snapshot id and authority epoch. expected_generation must equal the
// indexer's quarantine_generation, which every applied quarantine, release and
// automatic quarantine increments, so a replayed command is refused (housegate
// spec 2026-10-10 §7.4); reason is non-empty. Proposed only after the tracks
// activation, as Raft tag 36.
message QuarantineIndexerCmd {
  uint64 indexer_id = 1;
  uint64 expected_generation = 2;
  string reason = 3;
  string authority_jws = 4;
}

// ReleaseIndexerCmd: purpose "arbiter-release-indexer-v1" over
// {indexer_id, expected_generation, acknowledged_rejected_blocks}; the list
// is sorted ascending and unique, empty when there is nothing to acknowledge.
// It must equal the indexer's unacknowledged rejected blocks exactly
// (housegate spec 2026-10-10 §7.5); each then counts as passed for the track
// and its rejected candidate parts are cleaned up. The same context binding
// and generation rule as QuarantineIndexerCmd; proposed only after the tracks
// activation, as Raft tag 37.
message ReleaseIndexerCmd {
  uint64 indexer_id = 1;
  uint64 expected_generation = 2;
  repeated uint64 acknowledged_rejected_blocks = 3;
  string authority_jws = 4;
}

// IndexerTrackView is one enrolled SI indexer's track in committed state
// (housegate spec 2026-10-10 §7.2-§7.6).
message IndexerTrackView {
  uint64 indexer_id = 1;
  // The track's frontier before its first own block: the activation cutover,
  // or {global safe prefix, promotion_seq} at its enrolment commit for an
  // indexer enrolled after the activation.
  TrackFrontier initial = 2;
  // Starts at 0; every applied quarantine, release and automatic quarantine
  // increments it. The next QuarantineIndexerCmd or ReleaseIndexerCmd names
  // it as expected_generation.
  uint64 quarantine_generation = 3;
  // The FSM's quarantine flag: set by a quarantine, manual or automatic, and
  // cleared by a release; admission reads only this flag. A released indexer
  // whose rejected parts are not yet cleaned is false here but is still listed
  // in TableRegistrySnapshot.quarantined_indexers, which its host reads.
  bool quarantined = 4;
  string quarantine_reason = 5;
  // The track's rejected blocks no release has acknowledged yet, ascending;
  // a release must list exactly these.
  repeated uint64 rejected_blocks = 6;
  // The rejected blocks a release acknowledged, ascending; each counts as
  // passed for the track.
  repeated uint64 acknowledged_rejected_blocks = 7;
  // The track's current safe prefix.
  uint64 prefix_block_seq = 8;
  // The track's entry in the latest published manifest, or initial when that
  // manifest carries none.
  TrackFrontier published = 9;
}

// TrackStateView answers ConsensusAdmin.GetTrackState. Before the tracks
// activation tracks_enabled is false and every other field is empty.
message TrackStateView {
  bool tracks_enabled = 1;
  // The track cutover the activation recorded: the sealed tip and the
  // promotion sequence when it applied.
  uint64 cutover_block_seq = 2;
  uint64 cutover_promotion_seq = 3;
  // The contiguous safe prefix over all blocks.
  uint64 global_safe_block_seq = 4;
  // safe_block_seq of the latest published manifest.
  uint64 published_safe_block_seq = 5;
  repeated IndexerTrackView indexers = 6;   // sorted by indexer_id
}

// ConsensusHoldMode selects what a consensus hold freezes (housegate spec
// 2026-10-14 §10.1-§10.2). A hold is leader-local and never replicated: it
// lives on the leader that granted it, in the Raft term it was granted in,
// and ends when the update that names it commits or is refused, when it is
// released, when it times out, or when that leader loses leadership.
enum ConsensusHoldMode {
  CONSENSUS_HOLD_MODE_UNSPECIFIED = 0;
  // The issuance hold (§10.1): the leader proposes no RecordPromotionIssued
  // on any track, so promotion_seq stays frozen, while acknowledgements,
  // publication and cleanups continue.
  CONSENSUS_HOLD_MODE_ISSUANCE = 1;
  // Leader drain mode (§10.2): the leader records each non-quarantined
  // track's promotion frontier block (before the tracks activation, the
  // global one), keeps issuing and re-issuing promotions for blocks at or
  // below it, and refuses only the first promotion of a later block.
  CONSENSUS_HOLD_MODE_DRAIN = 2;
}

// PrepareConsensusUpdateRequest asks the leader for a hold before an update
// is signed against the promotion_seq the hold reports.
message PrepareConsensusUpdateRequest {
  // Required: UNSPECIFIED is INVALID_ARGUMENT.
  ConsensusHoldMode mode = 1;
  // Required: an authority-signed update that authorizes the hold, signed
  // against the current epoch, params digest and promotion_seq. The leader
  // checks it exactly as UpdateConsensusParams does (token shape, current
  // authority set, max token age, preconditions, update validator) and never
  // proposes it. In ISSUANCE mode it is the update to submit under the hold;
  // in DRAIN mode the update to submit is signed against the promotion_seq
  // the ready hold reports.
  UpdateConsensusParamsCmd draft = 2;
  // The hold's lifetime in milliseconds: 0 selects the leader's maximum for
  // the mode (consensus_admin.max_issuance_hold or
  // consensus_admin.max_drain_mode), and a larger value is capped to it.
  uint64 timeout_ms = 3;
}

// ConsensusHoldRef names one hold. hold_id is 128 random bits as 32 lowercase
// hex characters, returned only to the caller that took the hold; knowing it
// is the capability to read or release the hold. UpdateConsensusParams names
// the hold it settles in the gRPC metadata key "arbiter-consensus-hold",
// never inside the Raft command.
message ConsensusHoldRef {
  string hold_id = 1;
}

// TrackDrain is one track's progress under a DRAIN hold.
message TrackDrain {
  uint64 indexer_id = 1;
  // A quarantined track does not hold the drain.
  bool quarantined = 2;
  // The track's current safe prefix.
  uint64 prefix_block_seq = 3;
  // The track's promotion frontier block recorded when the hold started, 0
  // for a track that was quarantined then. The leader issues no first
  // promotion of a later block of this track while the hold lasts.
  uint64 frontier_block_seq = 4;
  // The track's blocks that still hold the drain, ascending: blocks above
  // the prefix up to the frontier that have not passed, and the blocks of
  // its promotions that are unacknowledged, wait for a cleanup
  // acknowledgement or still have promoted hg_unsafe parts.
  repeated uint64 in_flight_blocks = 5;
}

// ConsensusHold is a granted hold as the leader holding it sees it now.
message ConsensusHold {
  string hold_id = 1;
  ConsensusHoldMode mode = 2;
  // The Raft term the hold was granted in; it is void in any other term.
  uint64 raft_term = 3;
  // The FSM's PromotionSeq now. ISSUANCE: frozen while the hold lasts and
  // equal to the draft's expected_promotion_seq. DRAIN: once ready is true it
  // no longer moves; sign the update's expected_promotion_seq with it.
  uint64 promotion_seq = 4;
  // When the hold expires on the leader's clock, Unix milliseconds.
  uint64 expires_unix_ms = 5;
  // ISSUANCE: true once the stage-2 drain gate passes (no promotion is
  // issued meanwhile, so acknowledgements and cleanups can finish). DRAIN:
  // true once the stage-2 drain gate passes and every non-quarantined
  // track's prefix has reached its recorded frontier (before the tracks
  // activation, the global prefix the global frontier).
  bool ready = 6;
  // The stage-2 drain gate's refusal at the read, verbatim; empty once it
  // passes. A hold of either mode is ready only when it is empty, because
  // UpdateConsensusParams is refused while it is set.
  string drain_refusal = 7;
  // A DRAIN hold before the tracks activation: the global safe prefix, the
  // global promotion frontier block recorded when the hold started, and the
  // blocks still in flight, ascending (the TrackDrain rules over every
  // block). Zero and empty otherwise.
  uint64 global_prefix_block_seq = 8;
  uint64 global_frontier_block_seq = 9;
  repeated uint64 in_flight_blocks = 10;
  // A DRAIN hold after the tracks activation: one entry per enrolled
  // indexer, ascending by indexer_id. Empty otherwise.
  repeated TrackDrain tracks = 11;
}

// Multi-source SI stage 3 P4 (housegate spec 2026-10-14 §14, §16 P4): a
// leader-local settle of a quarantined track. Never a Raft command and never
// reachable from RaftCommand. authority_jws is an ES256K JWS by a current
// authority address with purpose "arbiter-settle-track-v1" over the canonical
// digest of {indexer_id, expected_generation, promotion_seqs}, bound to the
// network id, genesis snapshot id and authority epoch; promotion_seqs is
// strictly ascending and equals the track's issued, unacknowledged promotions.
message SettleTrackRequest {
  uint64 indexer_id = 1;
  uint64 expected_generation = 2;
  repeated uint64 promotion_seqs = 3;
  string authority_jws = 4;
  uint64 timeout_ms = 5;
}
message TrackSettleRef { uint64 indexer_id = 1; }
enum TrackSettleState {
  TRACK_SETTLE_STATE_UNSPECIFIED = 0;
  TRACK_SETTLE_STATE_ACTIVE = 1;
  TRACK_SETTLE_STATE_SETTLED = 2;
  TRACK_SETTLE_STATE_RELEASED = 3;
  TRACK_SETTLE_STATE_EXPIRED = 4;
  TRACK_SETTLE_STATE_LEADERSHIP_LOST = 5;
}
message TrackSettle {
  uint64 indexer_id = 1;
  bool quarantined = 2;
  uint64 quarantine_generation = 3;
  repeated uint64 unacked_promotion_seqs = 4;
  TrackSettleState state = 5;
  repeated uint64 promotion_seqs = 6;
  uint64 raft_term = 7;
  uint64 expires_unix_ms = 8;
  string snode_node_id = 9;
  bool snode_settle_capable = 10;
  uint64 sends = 11;
}

// RebalanceGroupCmd (Raft tag 38) is both the ConsensusAdmin.RebalanceGroup
// request and the Raft command (spec §6.4). authority_jws is an ES256K JWS by
// a current authority address with purpose "arbiter-rebalance-group-v1" over
// {owner_indexer_id, database_id, expected_generation, add, remove,
// network_fill}, bound to the network id, genesis snapshot id and authority
// epoch. add and remove are sorted, unique and disjoint; network_fill is the
// group's fill after the command.
message RebalanceGroupCmd {
  uint64 owner_indexer_id = 1;
  string database_id = 2;
  uint64 expected_generation = 3;
  repeated string add = 4;
  repeated string remove = 5;
  bool network_fill = 6;
  string authority_jws = 7;
}

// ReselectVerifiersCmd (Raft tag 39) replaces verifiers of one block's set
// (spec §7.4); expected_set is the block's current set, three sorted unique
// ids. Signed by the orchestrator's authority signer, purpose
// "arbiter-reselect-verifiers-v1", context-bound like RebalanceGroupCmd. The
// leader proposes it; there is no RPC. Apply refuses it before the
// reselection switch with "re-selection is refused until the reselection
// switch is on" (plan S3-E1 K67).
message ReselectVerifiersCmd {
  uint64 l3_block_seq = 1;
  repeated string expected_set = 2;
  string authority_jws = 3;
}

// MarkMemberLaggingCmd (Raft tag 42) is both the ConsensusAdmin
// MarkMemberLagging request and the Raft command (spec §9.2); Apply re-checks
// it against committed state. Purpose "arbiter-mark-member-lagging-v1",
// context-bound; observed_entry.indexer_id equals owner_indexer_id.
message MarkMemberLaggingCmd {
  string node_id = 1;
  uint64 owner_indexer_id = 2;
  string database_id = 3;
  TrackFrontier observed_entry = 4;
  string authority_jws = 5;
}

// Stage3SwitchCutover records one stage-3 switch's turn-on: switch_name is the
// Stage3Params field name; epoch is the update's epoch; cutover_block_seq and
// cutover_promotion_seq are the sealed tip (after the update's own seal, for
// placement) and the promotion sequence when it applied.
message Stage3SwitchCutover {
  string switch_name = 1;
  uint64 epoch = 2;
  uint64 cutover_block_seq = 3;
  uint64 cutover_promotion_seq = 4;
}

// Stage3StateView answers ConsensusParamsState.stage3_state: the v21
// activation's epoch, sealed tip and promotion sequence, and every switch
// turned on since, in turn-on order.
message Stage3StateView {
  uint64 activation_epoch = 1;
  uint64 activation_block_seq = 2;
  uint64 activation_promotion_seq = 3;
  repeated Stage3SwitchCutover switches = 4;
}

service ConsensusAdmin {
  // Local static capability probe: no leader redirection or Raft barrier.
  rpc GetProtocolInfo (google.protobuf.Empty) returns (ProtocolInfo) {}
  // Leader-only read with a barrier; followers return NotLeader details.
  rpc GetConsensusParams (google.protobuf.Empty) returns (ConsensusParamsState) {}
  // Leader-only, explicitly enabled mutation. Ack means committed success;
  // unlike idempotent data-plane writes, a consumed epoch is an error.
  rpc UpdateConsensusParams (UpdateConsensusParamsCmd) returns (Ack) {}
  // Leader-only read with a barrier: the replica-derived abort record for the
  // consumed reservation of one account/statement, with reason_code and
  // cleanup_authorization_root left empty for the authority to fill and sign.
  // NotFound when that identity holds no consumed reservation.
  rpc GetSnapshotQueryAbortCandidate (GetSnapshotQueryAbortCandidateRequest) returns (SnapshotQueryAbortRecord) {}
  // Leader-only, authority-authenticated terminal abort; returns the terminal
  // status (lifecycle "terminal", execution_outcome "aborted", terminal_proof).
  rpc AbortSnapshotQuery (AbortSnapshotQueryRequest) returns (SnapshotQueryStatus) {}
  // Leader-only, explicitly enabled mutation: proposes Raft tag 23.
  rpc ActivateQueryProfile (ActivateQueryProfileRequest) returns (Ack) {}
  // Leader-only read with a barrier: one entry per non-evicted verifier and
  // SNode registration joined with the leader's non-replicated feature book.
  rpc GetNodeFeatures (google.protobuf.Empty) returns (NodeFeatures) {}
  // Leader-only, authority-authenticated eviction (housegate spec 2026-10-10
  // §6.5): proposes EvictNodeCmd carrying expected_registration_seq and
  // authority_jws. Refused with FAILED_PRECONDITION until the signed-claims
  // activation has committed, because no earlier command may carry those
  // fields. Ack means committed success.
  rpc EvictNode (EvictNodeRequest) returns (Ack) {}
  // Leader-only, authority-authenticated quarantine of one SI indexer
  // (housegate spec 2026-10-10 §7.4): proposes Raft tag 36. Refused with
  // FAILED_PRECONDITION until the tracks activation has committed, because no
  // earlier command may carry it. Ack means committed success.
  rpc QuarantineIndexer (QuarantineIndexerCmd) returns (Ack) {}
  // Leader-only, authority-authenticated release (housegate spec 2026-10-10
  // §7.4-§7.5): proposes Raft tag 37. FAILED_PRECONDITION before the tracks
  // activation. Ack means committed success.
  rpc ReleaseIndexer (ReleaseIndexerCmd) returns (Ack) {}
  // Leader-only read with a barrier; followers return NotLeader details.
  // Before the tracks activation it answers tracks_enabled false and no
  // indexers.
  rpc GetTrackState (google.protobuf.Empty) returns (TrackStateView) {}
  // Leader-only, explicitly enabled (consensus_updates_enabled), authorized
  // by the request's draft (housegate spec 2026-10-14 §10.1-§10.2): grants
  // one leader-local hold and returns it. Every refusal comes before any log
  // write; a second hold while one is active is FAILED_PRECONDITION. Nothing
  // is proposed: the hold is not replicated, and followers return NotLeader
  // details.
  rpc PrepareConsensusUpdate (PrepareConsensusUpdateRequest) returns (ConsensusHold) {}
  // Leader-only read with a barrier. NOT_FOUND for a hold_id this leader does
  // not hold, including a hold that has ended ("unknown consensus hold").
  rpc GetConsensusHold (ConsensusHoldRef) returns (ConsensusHold) {}
  // Leader-only: ends the hold. Idempotent: a hold_id this leader does not
  // hold answers Ack.
  rpc ReleaseConsensusHold (ConsensusHoldRef) returns (Ack) {}
  // Leader-only, authority-authenticated and leader-local (never proposed):
  // streams the listed issued, unacknowledged promotions of a quarantined
  // track to its settle-capable SNode with settle set, until each is
  // acknowledged. FAILED_PRECONDITION before the tracks activation.
  rpc SettleTrack (SettleTrackRequest) returns (TrackSettle) {}
  // Leader-only read with a barrier: the indexer's current or last settle on
  // this leader, or (state UNSPECIFIED) its quarantine and withheld promotions,
  // the preview arbiter-admin signs.
  rpc GetTrackSettle (TrackSettleRef) returns (TrackSettle) {}
  // Leader-only, authority-authenticated (spec §6.4): proposes Raft tag 38.
  // FAILED_PRECONDITION "group rebalancing is refused until the placement
  // switch is on" before it (plan S3-E1 K67). Ack means committed success.
  rpc RebalanceGroup (RebalanceGroupCmd) returns (Ack) {}
  // Leader-only, authority-authenticated (spec §9.2, §16 playbook): proposes
  // Raft tag 42. FAILED_PRECONDITION "marking a member lagging is refused until
  // the checkpoints switch is on" before it. Ack means committed success.
  rpc MarkMemberLagging (MarkMemberLaggingCmd) returns (Ack) {}
}

// GetConsensusHistoryRequest asks for the committed consensus updates that
// move the parameters from from_epoch on: the answer's first update, if any,
// has expected_epoch == from_epoch.
message GetConsensusHistoryRequest {
  uint64 from_epoch = 1;
}

// ConsensusHistory is the serving voter's applied history of signed consensus
// updates. It lets a data-plane client (an SNode) follow the authority set as
// a light client: starting from a configured trust anchor, it verifies each
// update against the set in force before it, so nothing in this answer has to
// be trusted on its own. updates are contiguous and ascending by
// expected_epoch, and the last one moves the parameters to current_epoch.
// A from_epoch above current_epoch answers no updates, not an error, so the
// client can tell a lagging voter from a rollback by comparing current_epoch.
message ConsensusHistory {
  string network_id = 1;
  string genesis_snapshot_id = 2;
  uint64 current_epoch = 3;
  // The bootstrap authority set (the epoch-0 trust root), for diagnostics.
  repeated string bootstrap_authority_addresses = 4;
  // Each committed update exactly as it was signed and applied.
  repeated UpdateConsensusParamsCmd updates = 5;
}

// ConsensusHistory is a data-plane read served on the data-plane listener,
// not on ConsensusAdmin. Any voter answers from its local applied state with
// no leader barrier: freshness is the caller's concern, and the caller
// verifies every signature itself.
service ConsensusHistoryService {
  rpc GetConsensusHistory (GetConsensusHistoryRequest) returns (ConsensusHistory) {}
}
