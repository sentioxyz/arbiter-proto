syntax = "proto3";

// table_registry — the dynamic storage-integrity table set (internal
// design doc 2026-09-23-dynamic-si-table-set-design).
// The leader observes the L2 Databases contract and proposes these commands
// with the chain evidence; Apply only checks them deterministically.
package arbiter;
option go_package = "github.com/sentioxyz/arbiter-proto/gen/pb;pb";

import "google/protobuf/empty.proto";
import "replay.proto";

// TableRegistryParams is set once through a signed consensus update and never
// changed. confirmation is "finalized" or "safe".
message TableRegistryParams {
  uint64 chain_id = 1;
  string databases_contract = 2;
  uint64 si_indexer_id = 3;
  uint64 activation_block = 4;
  string confirmation = 5;
}

// ClientLaneParams enables client_seq lanes (housegate spec 2026-10-09 D13).
// Absent until an authority-signed consensus update sets it; afterwards every
// update carries it, max_lanes_per_account only rises, and it is never removed.
// Defined here because consensus.proto imports this file.
message ClientLaneParams {
  uint32 max_lanes_per_account = 1;
}

// SIIndexerEntry enrols one indexer in the network's storage-integrity layer
// (housegate spec 2026-10-10 D3, §6.1-§6.2). The si_indexers consensus
// parameter lists these entries sorted by indexer_id and is append-only:
// indexer_id, activation_block and snode_node_id never change, and signer
// changes only together with a new enrollment_jws signed by the new signer.
// The founding indexer of an existing registry is restated as the entry whose
// indexer_id and activation_block equal TableRegistryParams.si_indexer_id and
// TableRegistryParams.activation_block. Defined here because consensus.proto
// imports this file and TableRegistrySnapshot carries the list.
message SIIndexerEntry {
  // IndexerRegistry id. 0 is a valid id (devnet2's founding indexer): an
  // entry exists because it is listed, never because its id is nonzero.
  uint64 indexer_id = 1;
  // First L2 block whose TableCreated events open SI incarnations for this
  // indexer; at least 1. An appended entry's value must exceed the registry's
  // committed L2 cursor block. Its Legacy seed is read at activation_block - 1.
  uint64 activation_block = 2;
  // Lowercase 0x + 40 hex: the indexer's IndexerRegistry signer. Its
  // secp256k1 key signs every message of the indexer's SNode (D6).
  string signer = 3;
  // Node id of the indexer's SNode, the source of every statement on the
  // indexer's tables (D5). Unique across entries and verifier entries, and
  // never the id of another registered node.
  string snode_node_id = 4;
  // ES256K compact JWS by signer with purpose "arbiter-snode-enrollment-v1"
  // over {network_id, genesis_snapshot_id, indexer_id, snode_node_id}: the
  // indexer operator consents to, and controls, this SNode identity (§6.2).
  // Byte-identical in every later update unless signer rotates.
  string enrollment_jws = 5;
}

// IndexerFailureDomain names one enrolled SI indexer's failure domain
// (housegate spec 2026-10-14 §6.1, §9.3); equal strings are one domain.
message IndexerFailureDomain {
  uint64 indexer_id = 1;
  string failure_domain = 2;
}

// Stage3Params is the stage-3 parameter (spec §6.1, §10.4). It is absent until
// the v21 activation, which sets it with every switch false; afterwards every
// consensus update carries it. Every field is explicit: there is no
// absent-means-default (plan S3-E1 K58). The switches and strict_copies are
// one-way; min_safe_copies and group_size never decrease; each switch requires
// every earlier switch in field order (purge, eviction_voiding,
// owner_aware_selection, placement, reselection, checkpoints, narrowed_drain).
// indexer_failure_domains is sorted by indexer_id without duplicates.
message Stage3Params {
  uint32 group_size = 1;
  bool network_fill_default = 2;
  uint32 min_safe_copies = 3;
  bool strict_copies = 4;
  repeated IndexerFailureDomain indexer_failure_domains = 5;
  uint32 max_lag_publications = 6;
  uint32 lag_low = 7;
  uint64 evidence_timeout_l2_blocks = 8;
  uint32 max_uncleaned_parts_per_partition = 9;
  uint32 max_uncleaned_parts_per_table = 10;
  bool exclude_quarantined_hosts = 11;
  bool purge = 12;
  bool eviction_voiding = 13;
  bool owner_aware_selection = 14;
  bool placement = 15;
  bool reselection = 16;
  bool checkpoints = 17;
  bool narrowed_drain = 18;
}

message L2BlockRef {
  uint64 number = 1;
  string hash = 2;
}

// L2EventRef locates one contract log. (block_number, log_index) orders events.
message L2EventRef {
  uint64 block_number = 1;
  string block_hash = 2;
  uint64 log_index = 3;
  string tx_hash = 4;
}

message LegacyTable {
  string database_id = 1;
  string table_id = 2;
  L2EventRef created = 3;
}

enum TableRetireReason {
  TABLE_RETIRE_REASON_UNSPECIFIED = 0;
  TABLE_RETIRE_REASON_TABLE_DELETED = 1;
  TABLE_RETIRE_REASON_DATABASE_DELETED = 2;
}

// Once per SI indexer, at that indexer's activation_block - 1: every table
// active on the indexer.
message SeedLegacyTablesCmd {
  L2BlockRef at_block = 1;
  repeated LegacyTable tables = 2;
  // The seeded indexer (housegate spec 2026-10-10 §6.3). Absent: the founding
  // indexer's seed at TableRegistryParams.activation_block - 1, the only form
  // before the signed-claims activation. Present only after the activation,
  // naming an unseeded si_indexers entry whose activation_block - 1 is
  // at_block.number. optional because indexer 0 is a valid id; never proposed
  // before the activation, when a voter whose decoder lacks this field would
  // refuse the command.
  optional uint64 indexer_id = 3;
}

// One SI incarnation: its TableCreated plus the first TableSchemaSet after it.
message AddTableCmd {
  string database_id = 1;
  string table_id = 2;
  L2EventRef created = 3;
  L2EventRef schema = 4;
  uint32 schema_version = 5;
  string schema_hash = 6;
  string schema_json = 7;
  // The owning indexer (housegate spec 2026-10-10 D4): the database's indexer
  // at the created block, resolved by the leader and re-derived by every
  // auditor. Required after the signed-claims activation, where it names an
  // si_indexers entry whose activation_block <= created.block_number; absent
  // before it. Apply refuses either violation. optional because indexer 0 is
  // a valid owner.
  optional uint64 owner_indexer_id = 8;
}

// A TableDeleted (one table) or a database deletion (every live table of the
// database, table_ids sorted ascending).
message RetireTablesCmd {
  string database_id = 1;
  repeated string table_ids = 2;
  L2EventRef deleted = 3;
  TableRetireReason reason = 4;
}

// Marks every log up to and including block `to` consumed.
message AdvanceL2CursorCmd {
  L2BlockRef to = 1;
}

// A data-plane role dropped its hg_* tables for this incarnation. Also the
// request of PromotionGateway.SubmitTablePurged, so the signature fields below
// are carried by the RPC and the Raft command alike.
message RecordTablePurgedCmd {
  string node_id = 1;
  uint64 incarnation_seq = 2;
  // SNODE reporter, after the signed-claims activation (housegate spec
  // 2026-10-10 §6.5): ES256K compact JWS by the signer of the si_indexers entry
  // whose snode_node_id is node_id, purpose "arbiter-snode-message-v1", kind
  // "table_purged", body {node_id, incarnation_seq}, bound to the network id
  // and genesis snapshot id. Empty for a verifier.
  string signer_jws = 3;
  // VERIFIER reporter, after the signed-claims activation: hex ed25519
  // signature by the node's verifiers-entry key over the "table_purged"
  // verifier-message hash of the same body and context. Empty for an SNode.
  // Before the activation the leader proposes neither signature.
  string ed25519_signature = 4;
}

// CheckpointExclusionReason is why a checkpoint excludes a table (plan S3-E1
// K63): a closed set; UNSPECIFIED and unknown values are refused.
enum CheckpointExclusionReason {
  CHECKPOINT_EXCLUSION_REASON_UNSPECIFIED = 0;
  CHECKPOINT_EXCLUSION_REASON_NOT_INSTALLED = 1;
  CHECKPOINT_EXCLUSION_REASON_DIVERGED = 2;
  CHECKPOINT_EXCLUSION_REASON_FOREIGN = 3;
  CHECKPOINT_EXCLUSION_REASON_DISK_THRESHOLD = 4;
  CHECKPOINT_EXCLUSION_REASON_AUDIT_PENDING = 5;
  CHECKPOINT_EXCLUSION_REASON_RETIRING = 6;
}

message ExcludedTable {
  string table_id = 1;
  CheckpointExclusionReason reason = 2;
}

// CheckpointGroup is one group a checkpoint speaks for; excluded is sorted by
// table_id without duplicates.
message CheckpointGroup {
  string database_id = 1;
  uint64 group_generation = 2;
  repeated ExcludedTable excluded = 3;
}

// MemberCheckpoint is a replicate member's statement that its copies of the
// listed groups' tables equal the manifest snapshot_id at entry =
// track_frontiers[owner] (spec §9.1). checkpoint_seq strictly increases per
// (member, owner); groups is sorted by database_id without duplicates.
message MemberCheckpoint {
  string node_id = 1;
  uint64 owner_indexer_id = 2;
  uint64 checkpoint_seq = 3;
  repeated CheckpointGroup groups = 4;
  string snapshot_id = 5;
  TrackFrontier entry = 6;
}

// MemberCheckpointCmd (Raft tag 41): replica_jws is the ES256K compact JWS of
// the member's verifiers-entry replica_signer, purpose
// "arbiter-member-checkpoint-v1", over the checkpoint bound to the network id
// and genesis snapshot id. Proposed only after the checkpoints switch.
message MemberCheckpointCmd {
  MemberCheckpoint checkpoint = 1;
  string replica_jws = 2;
}

// MemberReadyCmd (Raft tag 40): a member reports its hg_member_unsafe
// replicas of group (owner_indexer_id, database_id) at generation (spec
// §6.4). ed25519_signature is hex, by the node's verifiers-entry ed25519 key,
// over the "arbiter-member-ready-v1" hash of {node_id, owner_indexer_id,
// database_id, generation} and the network context. Proposed only after the
// placement switch.
message MemberReadyCmd {
  string node_id = 1;
  uint64 owner_indexer_id = 2;
  string database_id = 3;
  uint64 generation = 4;
  string ed25519_signature = 5;
}

// ============================================================
// TableRegistry read API (sub-project 2c). Leader-barriered like SafeState;
// a follower answers FAILED_PRECONDITION with a NotLeader detail.
// ============================================================

enum TableIncarnationStatus {
  TABLE_INCARNATION_STATUS_UNSPECIFIED = 0;
  TABLE_INCARNATION_STATUS_LEGACY = 1;
  TABLE_INCARNATION_STATUS_PENDING = 2;
  TABLE_INCARNATION_STATUS_REFUSED = 3;
  TABLE_INCARNATION_STATUS_ACTIVE = 4;
  TABLE_INCARNATION_STATUS_RETIRING = 5;
  TABLE_INCARNATION_STATUS_PURGING = 6;
  TABLE_INCARNATION_STATUS_PURGED = 7;
}

enum TableIncarnationOrigin {
  TABLE_INCARNATION_ORIGIN_UNSPECIFIED = 0;
  TABLE_INCARNATION_ORIGIN_GENESIS = 1;
  TABLE_INCARNATION_ORIGIN_LEGACY = 2;
  TABLE_INCARNATION_ORIGIN_CHAIN = 3;
}

// TableRegistryCursor is the registry's L2 position: the last consumed log,
// or the whole block when block_complete.
message TableRegistryCursor {
  uint64 block_number = 1;
  string block_hash = 2;
  uint64 log_index = 3;
  bool block_complete = 4;
}

// TableIncarnation mirrors arbiter fsm.TableIncarnation (json tags == field
// names). refused_code is one of the stable admission-rules-v1 codes
// ("dotted_id", "previous_incarnation_not_purged", "schema_decode",
// "table_id_mismatch", "no_columns", "column_name", "reserved_column",
// "column_type", "non_canonical_type", "partition_freeze",
// "schema_hash_mismatch", "physical_name_collision"); refused_reason is its
// human-readable detail.
message TableIncarnation {
  uint64 seq = 1;
  string database_id = 2;
  string table_id = 3;
  TableIncarnationOrigin origin = 4;
  TableIncarnationStatus status = 5;
  L2EventRef created = 6;
  L2EventRef schema_ref = 7;
  uint32 schema_version = 8;
  string schema_hash = 9;
  string schema_json = 10;
  string refused_reason = 11;
  string refused_code = 12;
  L2EventRef deleted = 13;
  TableRetireReason retire_reason = 14;
  uint64 add_block_seq = 15;
  uint64 retire_block_seq = 16;
  repeated string purged_by = 17;
  // The owning SI indexer (housegate spec 2026-10-10 D4): the database's
  // indexer at the TableCreated block; never changes. Absent before the
  // signed-claims activation, when every incarnation belongs to
  // TableRegistryParams.si_indexer_id; the activation sets it on every
  // existing incarnation and every later one is recorded with it. optional
  // because indexer 0 is a valid owner.
  optional uint64 owner_indexer_id = 18;
  // Set by Apply on every chain incarnation recorded after the stage-3 purge
  // switch (spec §8.8): its hg_unsafe and hg_member_unsafe replicas use
  // /sentio/<shard>/unsafe_inc/<db__table>/<seq> instead of
  // /sentio/<shard>/unsafe/<db__table>. Never set on an earlier incarnation.
  bool scoped_keeper_path = 19;
  // The members of the incarnation's group at any generation since it was
  // recorded (plan S3-E1 K60), sorted ascending without duplicates. Each must
  // report the incarnation's purge; a node leaves only through EvictNode.
  repeated string purge_members = 20;
}

// TableRegistrySnapshot is the whole committed registry at one version.
// incarnations are in seq order (seq = index + 1), except in a delta
// (delta_base_version set), which only a WatchTableRegistry stream opened
// with accept_delta sends.
//
// The arbiter serves registry history compacted (internal design doc
// 2026-09-23-dynamic-si-table-set-design §5): a PURGED incarnation carries no
// schema_json, schema_ref, created, deleted or purged_by, and a REFUSED one
// no schema_json. Its identity (seq, key, origin, status, owner, schema
// version and hash, block seqs, scoped_keeper_path, purge_members) is always
// served.
message TableRegistrySnapshot {
  TableRegistryParams params = 1;
  uint64 version = 2;
  bool seeded = 3;
  TableRegistryCursor cursor = 4;
  repeated TableIncarnation incarnations = 5;
  // The committed client-lane parameter, so data-plane nodes learn activation
  // through the registry follower. Setting or raising it bumps version.
  ClientLaneParams client_lanes = 6;
  // The committed si_indexers parameter, sorted by indexer_id, so data-plane
  // nodes and hosts learn enrolments through the registry follower (housegate
  // spec 2026-10-10 §6.3). Empty before the signed-claims activation. Every
  // committed change bumps version.
  repeated SIIndexerEntry si_indexers = 7;
  // Ids of the indexers whose Legacy seed is recorded, ascending and unique.
  // Empty before the signed-claims activation, when seeded alone describes the
  // founding indexer; from the activation on it holds the founding indexer iff
  // seeded is true.
  repeated uint64 seeded_indexers = 8;
  // Ids of the SI indexers whose host must refuse its own tables, ascending
  // (housegate spec 2026-10-10 §7.4, §7.5, §10): those that are quarantined, or
  // released with rejected parts not yet cleaned. A release clears the FSM's
  // quarantine flag at once (admission reads only that flag, and
  // IndexerTrackView.quarantined reports it), but the rejected candidate rows
  // stay in hg_unsafe until their cleanup is acknowledged, so the id stays
  // listed, and its host keeps refusing reads and writes, until the cleanup of
  // all its rejected parts is acknowledged. Hosts learn the list through the
  // registry follower. Empty before the tracks activation, so set only after
  // it. Every committed quarantine, release and automatic quarantine bumps
  // version, and so does the acknowledgement of an indexer's last uncleaned
  // rejected part.
  repeated uint64 quarantined_indexers = 9;
  // The database groups (spec §6.2), sorted by (owner_indexer_id,
  // database_id); empty before the placement switch. Every committed change
  // bumps version.
  repeated DatabaseGroup groups = 10;
  // The highest accepted checkpoint_seq per (member, owner) (spec §9.1),
  // sorted by (node_id, owner_indexer_id); kept through group removal.
  repeated MemberCheckpointSeq member_checkpoint_seqs = 11;
  // The committed stage-3 parameter, so data-plane nodes learn the switches
  // through the registry follower (plan S3-E1 K64); absent before the v21
  // activation. Every committed change bumps version.
  Stage3Params stage3 = 12;
  // Set only on a WatchTableRegistry stream opened with accept_delta: the
  // version of the previous message on the same stream, which this one
  // updates. A delta carries every field in full except incarnations, which
  // lists, in seq order, only the incarnations that differ from that previous
  // message, every new one included. The receiver replaces its incarnation of
  // each listed seq or appends it (incarnations are never removed), and then
  // holds incarnation_count incarnations numbered 1..incarnation_count. A
  // receiver that does not hold delta_base_version (it refused a message)
  // reopens the stream with since_version set to the version it holds, whose
  // first message is never a delta. Zero on every full snapshot, including
  // every GetTableRegistry answer and the first message of every stream.
  uint64 delta_base_version = 13;
  // The total number of incarnations at version; set on a delta.
  uint64 incarnation_count = 14;
}

// PurgeNodeSet is the committed set of data-plane nodes whose
// SubmitTablePurged completes a purge: every registered, non-evicted SNode and
// verifier, sorted ascending. After the signed-claims activation one
// incarnation's purge waits only on its owner's SNode and every non-evicted
// verifier (housegate spec 2026-10-10 §6.6). A replica under a table's Keeper
// path whose name is not in the set belongs to a decommissioned node.
message PurgeNodeSet {
  repeated string node_ids = 1;
}

// MemberClass is a member's class in one group (spec §9.2). A Leaving member
// is not in DatabaseGroup.members; its record is in DatabaseGroup.leaving.
enum MemberClass {
  MEMBER_CLASS_UNSPECIFIED = 0;
  MEMBER_CLASS_BOOTSTRAPPING = 1;
  MEMBER_CLASS_CAUGHT_UP = 2;
  MEMBER_CLASS_BEHIND = 3;
  MEMBER_CLASS_LAGGING = 4;
}

// MemberCheckpointRecord is a stored checkpoint with its signature and the
// consensus epoch whose replica_signer verified it.
message MemberCheckpointRecord {
  MemberCheckpoint checkpoint = 1;
  string replica_jws = 2;
  uint64 epoch = 3;
}

// GroupMember is one current member of a group. ready_generation is 0 until
// a MemberReady is recorded; the member is ready once ready_generation >=
// joined_generation. checkpoint is the stored checkpoint for this group, absent
// before the first; observed_entry is set only while member_class is LAGGING;
// lag_advances counts the owner's published advances after the checkpoint
// entry, saturating at stage3.max_lag_publications + 1, and is 0 without a
// checkpoint (plan S3-E3 K76). host_indexer_id is the host_indexer_id of the
// member's entry in the committed verifiers parameter, filled by the server
// when it serves the view (never stored in FSM state; fixed for the entry's
// life, plan S3-E2 K68); it is absent while the node has no host-bound
// verifiers entry (a delisted member stays in members, plan S3-E3 K73), and a
// consensus update that lists or delists a member changes the view, so it
// bumps version. optional because indexer 0 is a valid host.
message GroupMember {
  string node_id = 1;
  uint64 joined_generation = 2;
  uint64 ready_generation = 3;
  MemberClass member_class = 4;
  MemberCheckpointRecord checkpoint = 5;
  TrackFrontier observed_entry = 6;
  uint64 lag_advances = 7;
  optional uint64 host_indexer_id = 8;
}

// LeavingMember is a member a RebalanceGroup removed (spec §6.4):
// release_entry is the owner's latest published entry when it applied;
// frozen_members and frozen_domains are E (node ids, sorted) and |E| as they
// were then, for the release outside strict mode; released is set the first
// time the release condition holds and never cleared.
message LeavingMember {
  string node_id = 1;
  uint64 removed_generation = 2;
  TrackFrontier release_entry = 3;
  repeated string frozen_members = 4;
  uint32 frozen_domains = 5;
  bool released = 6;
}

// DatabaseGroup is G(owner, database) (spec §6.2). members is sorted by
// node_id; past_members is sorted without duplicates; leaving is sorted by
// node_id; group_key is the current GroupKey (spec §7.1); placement_salt is
// the salt the placement used (plan S3-E1 K61).
message DatabaseGroup {
  uint64 owner_indexer_id = 1;
  string database_id = 2;
  repeated GroupMember members = 3;
  bool network_fill = 4;
  uint64 generation = 5;
  repeated string past_members = 6;
  repeated LeavingMember leaving = 7;
  string group_key = 8;
  string placement_salt = 9;
}

// MemberCheckpointSeq is the highest accepted checkpoint_seq of one member for
// one owner under replica_signer (spec §9.1); a member signs its next
// checkpoint above both its journal and this value.
message MemberCheckpointSeq {
  string node_id = 1;
  uint64 owner_indexer_id = 2;
  uint64 checkpoint_seq = 3;
  string replica_signer = 4;
}

message WatchTableRegistryRequest {
  // The stream sends a snapshot whenever the registry version exceeds the
  // last version sent, starting from since_version (0 = send the current one).
  // A version that changed nothing but the cursor may be held back for a
  // server-configured heartbeat (five minutes by default) and then sent.
  uint64 since_version = 1;
  // Asks for deltas (TableRegistrySnapshot.delta_base_version): after the
  // stream's first message, each message lists only the incarnations that
  // changed since the previous one. An arbiter that predates the field
  // ignores it and sends full snapshots, so a receiver that sets it must
  // still accept a full snapshot (delta_base_version zero) at any time.
  bool accept_delta = 2;
}

service TableRegistry {
  // FAILED_PRECONDITION "table registry is disabled" until the governed
  // parameter is committed.
  rpc GetTableRegistry (google.protobuf.Empty) returns (TableRegistrySnapshot) {}
  // Snapshots, coalesced: intermediate versions may be skipped. Full
  // snapshots unless the request sets accept_delta. Waits
  // while the registry is disabled; ends with NotLeader when this node loses
  // leadership.
  rpc WatchTableRegistry (WatchTableRegistryRequest) returns (stream TableRegistrySnapshot) {}
  // The current purge node set. Leader-barriered like GetTableRegistry and
  // answered whether or not the registry is enabled.
  rpc GetPurgeNodeSet (google.protobuf.Empty) returns (PurgeNodeSet) {}
}
