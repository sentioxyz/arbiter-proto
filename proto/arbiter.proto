syntax = "proto3";

// arbiter — gRPC contract for the Sentio Arbiter (design §11): statement
// ingress, source result claims, verifier dispatch/attestation, promotion
// dispatch/ack, safe-state reads, and membership.
//
// Direction convention (§11.1): the data plane always dials the Arbiter.
// Unary calls go client → Arbiter; Arbiter-initiated dispatch rides
// node-initiated server-streaming subscriptions. Write-class RPCs on a
// non-leader fail with gRPC FAILED_PRECONDITION carrying a NotLeader detail;
// subscribe streams are only established against the leader (§11.3).
//
// Idempotency keys (§10.3, §11.3): SubmitStatement (client_account,
// client_seq); RegisterResultClaim statement_id; SubmitAttestation
// (replica_id, block_seq); SubmitByteSideScan (replica_id, block_seq);
// AckPromotion promotion_seq. Duplicate submissions return the original
// result, never an error.
package arbiter;
option go_package = "github.com/sentioxyz/arbiter-proto/gen/pb;pb";

import "replay.proto";
import "table_registry.proto";

// ============================================================
// Ingress: HouseGate → Arbiter (§5.5 route A / optimistic-forward)
// ============================================================

// StatementID is the structured client-assigned statement identity.
// Uniqueness key is (client_account, client_lane, client_seq) — client_nonce
// contributes entropy to _hg_row_id but is NOT part of the uniqueness key.
// Flat string form (replay projection, RCRecord linkage, row-id derivation):
// "<lowercase client_account>:<decimal client_seq>:<client_nonce>" for the
// legacy default lane, "<account>:<client_lane>:<seq>:<nonce>" for a lane.
message StatementID {
  // Lowercase 0x-prefixed Ethereum address of the signing account.
  string client_account = 1;
  uint64 client_seq = 2;
  string client_nonce = 3;
  // Client lane (housegate spec 2026-10-09 D9): exactly 16 lowercase hex
  // characters, or empty for the legacy default lane. Admitted only once the
  // consensus parameter client_lanes is set; before that a laned statement is
  // ADMISSION_CODE_MALFORMED.
  string client_lane = 4;
}

// StatementKind gates admission (§4.1 SubmitStatement). v1 admits INSERT
// only; DDL/mutation kinds arrive with P2+ and extend this enum.
enum StatementKind {
  STATEMENT_KIND_UNSPECIFIED = 0;
  STATEMENT_KIND_INSERT = 1;
  // Admitted only through the separate snapshot-query RPC and v3 envelope.
  STATEMENT_KIND_SNAPSHOT_QUERY = 2;
}

// StatementEnvelopeV2 is the signed write-statement envelope HouseGate
// submits after validating the user signature and spooling the payload to
// the payload store at ingest (§3.5 step 1-2). The Arbiter re-verifies
// user_jws deterministically in Apply (§4.1).
message StatementEnvelopeV2 {
  StatementID statement_id = 1;
  // Bound by user_jws from envelope v2.1 (arbiter-proto v0.6.0) onward: the
  // signed payload carries "statement_kind" as this enum's numeric value, so
  // an operator cannot re-label an INSERT as another kind once the mutation
  // lane ships. v1 still admits INSERT only.
  StatementKind statement_kind = 2;
  string sql = 3;
  // DigestString(sql) under the housegate-replay-mvp-v0 profile.
  string sql_hash = 4;
  // v2: CanonicalDigest("housegate-settings-v1", []) — the constant empty
  // user-settings digest; the SI lane admits no client settings in v1.
  string settings_hash = 5;
  string payload_ref = 6;
  string payload_hash = 7;
  uint64 payload_length = 8;
  string target_table_id = 9;
  // The user's signature binding the statement (JWS compact form). v2:
  // purpose "housegate-statement-v2" over every signed field below.
  string user_jws = 10;
  // ---- v2 additions (all signed by user_jws) ----
  uint32 envelope_version = 11;   // must be 2
  string network_id = 12;         // must equal the Arbiter genesis network id
  uint32 keeper_shard_id = 13;    // must be 0 in v1 (Sharder returns group 0)
  string payload_format = 14;     // "clickhouse-native-data-v1"
  uint32 client_revision = 15;    // ClickHouse client protocol revision the Native blocks were encoded for
  string schema_hash = 16;        // Phase-B TableSchemaHash the payload was encoded against
  string row_id_profile_id = 17;  // "housegate-row-id-v1"
}

// AdmissionCode is the application-level admission taxonomy. Transport
// failures are gRPC errors; admission rejections return OK + a code, the
// rewriter-go RewriteCode pattern.
enum AdmissionCode {
  ADMISSION_CODE_UNSPECIFIED = 0;
  ADMISSION_CODE_ACCEPTED = 1;
  // Reused (client_account, client_seq): a CLIENT BUG the SDK must surface,
  // never silently drop (§6.1). Do not retry with the same client_seq.
  ADMISSION_CODE_DUPLICATE_CLIENT_SEQ = 2;
  ADMISSION_CODE_SCHEMA_NOT_ALLOWED = 3;
  ADMISSION_CODE_KIND_NOT_ADMITTED = 4;
  ADMISSION_CODE_INVALID_SIGNATURE = 5;
  // The carried non-membership proof failed verification against
  // spent_ids_root (gap-fill path only, §6.3).
  ADMISSION_CODE_INVALID_PROOF = 6;
  ADMISSION_CODE_MALFORMED = 7;
  // The account's open gap-range budget (K = 64, frozen in the
  // sentio-spent-ids-v1 profile) would be exceeded. A jump adds one open
  // range; a mid-range fill splits one into two. Remedy: fill from a
  // range's EDGES (never increases the count), or continue from the
  // high-water mark. Distinct from DUPLICATE_CLIENT_SEQ: the coordinate is
  // unspent, the account's gap state is what rejects it.
  ADMISSION_CODE_GAP_BUDGET_EXCEEDED = 8;
  // A statement would open a new client lane for an account that already
  // holds client_lanes.max_lanes_per_account lanes. The coordinate is unspent;
  // the client continues on a lane it already holds or on the legacy lane.
  ADMISSION_CODE_LANE_BUDGET_EXCEEDED = 9;
  // The statement's source — the SNode of its target table's owner,
  // si_indexers[owner].snode_node_id — is not registered and Active in
  // committed state (housegate spec 2026-10-10 §6.4). Returned only after the
  // signed-claims activation. Nothing changed: the coordinate is unspent, and
  // HouseGate answers a retryable, session-preserving refusal.
  ADMISSION_CODE_SOURCE_UNAVAILABLE = 10;
  // The statement's target table belongs to an SI indexer that is quarantined
  // (housegate spec 2026-10-10 §7.4). Admission checks it immediately before
  // the owner-source check, so a quarantined indexer's tables never answer
  // SOURCE_UNAVAILABLE. Returned only after the tracks activation. Nothing
  // changed: the coordinate is unspent. Not retryable until an
  // authority-signed ReleaseIndexerCmd releases the indexer; HouseGate
  // answers a non-retryable, session-preserving refusal (ClickHouse 392).
  ADMISSION_CODE_INDEXER_QUARANTINED = 11;
}

message SequencedAck {
  AdmissionCode code = 1;
  // Human-readable rejection detail; empty on ACCEPTED.
  string message = 2;
  // Assigned global statement sequence; set only when code == ACCEPTED.
  uint64 statement_seq = 3;
}

// ============================================================
// Source result claims: source SNode → Arbiter (§4.1 RegisterRC)
// ============================================================

// CandidatePart is one hg_unsafe part the source claims a statement
// produced. part_row_lthash is the part's content commitment and its
// identity everywhere downstream (part names are unstable after
// attach/replace, base-spec §12.2).
message CandidatePart {
  string table_id = 1;
  string partition_id = 2;
  // Advisory: the hg_unsafe part name at claim time.
  string part_name = 3;
  string part_row_lthash = 4;
  string part_phys_hash = 5;
  uint64 row_count = 6;
  uint64 bytes = 7;
}

// PartitionLtHashSum is the source's claimed per-partition sum of new-part
// LtHash contributions — the "claimed" side of check 2's additive equation
// base + claimed == post (§7.3).
message PartitionLtHashSum {
  string table_id = 1;
  string partition_id = 2;
  // "0x" + hex of the raw 2048-byte LtHash accumulator sum.
  string new_parts_lthash_sum = 3;
}

// RCRecord is the source's result claim (§4.1, §7.3). Late binding: an
// RCRecord may arrive before its statement_seq exists; the FSM parks it
// under statement_id and binds when SubmitStatement assigns the seq (§5.5).
// Before the signed-claims activation (housegate spec 2026-10-10 §6.7) the
// FSM trusts the gRPC channel for source identity; after it every claim,
// parked or bound, must carry a valid source_jws.
message RCRecord {
  StatementID statement_id = 1;
  // NodeID of the claiming source SNode. It must equal the statement's bound
  // source: the deterministic hash selection (§5.4) before the signed-claims
  // activation, the owner's SNode (si_indexers[owner].snode_node_id) after it.
  string source_node = 2;
  repeated CandidatePart candidate_parts = 3;
  // The source's claimed post-state root (check 1's right-hand side).
  string source_claim_root = 4;
  repeated PartitionLtHashSum partition_new_part_sums = 5;
  // After the signed-claims activation: ES256K compact JWS by the signer of
  // the si_indexers entry whose snode_node_id is source_node, purpose
  // "arbiter-snode-message-v1", kind "result_claim", over this record without
  // source_jws, bound to the network id and genesis snapshot id. Request-only:
  // the server moves it into RegisterRCCmd.source_jws, and an RCRecord inside
  // a RaftCommand never carries it. Dropped before the activation.
  string source_jws = 6;
}

// ============================================================
// Verifier dispatch + evidence: Arbiter ⇄ Verifier (§7.1 two rounds)
// ============================================================

message VerifierHello {
  string replica_id = 1;
}

// VerifierDispatch is the leader→verifier dispatch stream payload. Two
// rounds per block (§7.1): the replay job first, then — after the replay
// attestation lands — the byte-side scan request. Kept as distinct kinds
// for auditability; they may be pipelined.
message VerifierDispatch {
  oneof dispatch {
    ReplayJob replay_job = 1;
    ByteSideScanRequest byte_side_scan = 2;
    SnapshotQueryJob snapshot_query_job = 3;
  }
}

// ByteSideScanRequest asks a verifier to recompute part_row_lthash from the
// real on-disk bytes of the candidate parts (check 3, §7.2). Parts are
// identified by content commitment, never by name — the verifier maps
// commitments to live _part names locally before SELECT ... WHERE _part IN.
message ByteSideScanRequest {
  uint64 block_seq = 1;
  repeated PartRef parts = 2;
}

// PartScan is one scanned part's result.
message PartScan {
  string table_id = 1;
  string partition_id = 2;
  // Identity: the source-claimed content commitment being checked.
  string claimed_part_row_lthash = 3;
  // The verifier's recomputation from on-disk bytes; check 3 compares this
  // recorded scalar against RCRecord.candidate_parts in the FSM (§7.3).
  string scanned_part_row_lthash = 4;
  // Advisory: the live _part name the verifier resolved locally.
  string live_part_name = 5;
}

// ByteSideScanMsg is the verifier's attested byte-side scan (§4.1
// RecordByteSideScan). scan_hash = CanonicalDigest over the canonical Go
// form (domain "arbiter-byte-side-scan-v1", frozen in the arbiter repo);
// signature = ed25519 over the scan_hash string bytes, hex-encoded — the
// same convention as ReplayAttestation.
message ByteSideScanMsg {
  string replica_id = 1;
  uint64 block_seq = 2;
  repeated PartScan parts = 3;
  string scan_hash = 4;
  string signature = 5;
}

// ============================================================
// Promotion: Arbiter → SNode (§8)
// ============================================================

// PartRef identifies a verified part by content commitment (§8.1).
message PartRef {
  string table_id = 1;
  string partition_id = 2;
  string part_row_lthash = 3;
  // Advisory name hint; never authoritative.
  string part_name = 4;
}

// PromoteSafePartition is the authority-signed promotion command (§8.1).
// candidate_parts lists EXACTLY the parts that passed the three-way check —
// SNode builds hg_promote from base + these only (the §7.3 closure rule).
message PromoteSafePartition {
  string table_id = 1;
  string partition_id = 2;
  // Monotonic per Arbiter; SNode persists a last-applied watermark per
  // (table, partition) and rejects seq <= watermark (§8.3 exactly-once).
  uint64 promotion_seq = 3;
  string base_safe_snapshot_id = 4;
  // Base partition's raw LtHash accumulator ("0x" + hex of 2048 bytes) for
  // the SNode-side CAS check (§8.3).
  string base_partition_root = 5;
  repeated PartRef candidate_parts = 6;
}

// UnsafeCleanup schedules the drop of promoted hg_unsafe parts (§8.5).
message UnsafeCleanup {
  string table_id = 1;
  string partition_id = 2;
  uint64 promotion_seq = 3;
  repeated PartRef parts = 4;
  // Non-zero only for a rejected-part cleanup (housegate spec 2026-10-10
  // §7.5): parts are never-promoted candidate parts of the Rejected
  // statements of block rejected_block_seq in this partition, and
  // promotion_seq is then 0. Only a ReleaseIndexerCmd that acknowledges the
  // block creates such work, so it is set only after the tracks activation;
  // never proposed before it in ScheduleUnsafeCleanupCmd, where a voter whose
  // decoder lacks this field refuses the command. The authority JWS covers it
  // through arbiter-core's canonical cleanup body, which omits it when zero.
  uint64 rejected_block_seq = 5;
}

// PromotionCommand is the leader→SNode dispatch stream payload. authority_jws
// is the Arbiter authority's secp256k1 JWS (compact form) whose payload
// carries purpose "arbiter-promotion" and a CanonicalDigest of the command
// (domains "arbiter-promote-command-v1" / "arbiter-cleanup-command-v1");
// SNode authorizes by address recovery against the authority allowlist
// (§8.1). SNode never promotes without a valid signature (§13).
message PromotionCommand {
  oneof cmd {
    PromoteSafePartition promote = 1;
    UnsafeCleanup cleanup = 2;
  }
  string authority_jws = 15;
}

message SNodeHello {
  string node_id = 1;
}

// SafePartMapping records where a promoted part landed in hg_safe — part
// names change across attach/replace, so the mapping is keyed by content
// commitment (§8.2).
message SafePartMapping {
  string part_row_lthash = 1;
  string safe_part_name = 2;
  string part_phys_hash = 3;
}

// PromotionAck reports REPLACE PARTITION completion. The FSM checks the
// closure equality post_partition_commitment == base + Σ verified new-part
// lthash before advancing the safe watermark (§7.3 closure, §8.4).
message PromotionAck {
  string node_id = 1;
  uint64 promotion_seq = 2;
  string table_id = 3;
  string partition_id = 4;
  // The absolute partition LtHash root SNode observed after promotion.
  string post_partition_commitment = 5;
  repeated SafePartMapping parts = 6;
  // applied=false signals a dropped shadow (base CAS failed); detail says
  // why. The Arbiter rebases and re-issues (§8.3).
  bool applied = 7;
  string detail = 8;
  // Complete active inventory of this safe partition after REPLACE, including
  // previously-safe parts whose physical names/hashes may have changed.
  // `parts` remains the candidate-only mapping. The FSM requires this list to
  // cover exactly its committed safe parts plus those candidates, keyed by
  // row LtHash, before replacing physical metadata. Missing inventory is only
  // equivalent to `parts` when the partition had no previously-safe parts.
  repeated SafePartMapping safe_partition_parts = 9;
  // After the signed-claims activation (housegate spec 2026-10-10 §6.6):
  // ES256K compact JWS by the signer of the si_indexers entry whose
  // snode_node_id is node_id, purpose "arbiter-snode-message-v1", kind
  // "promotion_ack", over this ack without source_jws, bound to the network id
  // and genesis snapshot id. Only the promotion's expected source (the owner's
  // SNode) may acknowledge it, and only its signed ack, applied=false
  // included, changes state. Request-only: the server moves it into
  // RecordPromotionAckCmd.source_jws. Dropped before the activation.
  string source_jws = 10;
}

message CleanupAck {
  string node_id = 1;
  uint64 promotion_seq = 2;
  string table_id = 3;
  string partition_id = 4;
  // After the signed-claims activation: signed like PromotionAck.source_jws,
  // with kind "cleanup_ack"; only the cleanup's expected source (the owner's
  // SNode) may clear it. Request-only: the server moves it into
  // RecordCleanupAckCmd.source_jws. Dropped before the activation.
  string source_jws = 5;
  // Echoes UnsafeCleanup.rejected_block_seq of the cleanup it acknowledges
  // (housegate spec 2026-10-10 §7.5): non-zero only for a rejected-part
  // cleanup, whose promotion_seq is 0, and covered by source_jws like the rest
  // of the ack. Only after the tracks activation: before it the promotion
  // gateway refuses an AckCleanup that carries it, and no RecordCleanupAckCmd
  // carries it.
  uint64 rejected_block_seq = 6;
}

// ============================================================
// Anchoring, safe-state reads, membership
// ============================================================

// AnchorRef references the L2 anchor of one L3 block (§5.2). v1 posts
// commitment only; da_ref is reserved so the decentralized phase can switch
// to commitment + DA reference as configuration, not protocol change.
message AnchorRef {
  string l3_block_hash = 1;
  string state_root = 2;
  // Chain-specific transaction reference of the anchor.
  string l2_tx_ref = 3;
  uint64 l2_block_number = 4;
  string da_ref = 5;
}

message GetSafeWatermarkRequest {}

message SafeWatermark {
  string snapshot_id = 1;
  uint64 safe_block_seq = 2;
  string manifest_root = 3;
}

message SnapshotRef {
  string snapshot_id = 1;
}

// BlockRef selects a manifest by SafeBlockSeq — the as_of_safe time-travel
// read (§8.5; time-travel is manifest-indexed, never a per-row column, §13).
message BlockRef {
  uint64 safe_block_seq = 1;
}

// L3BlockHeader mirrors arbiter fsm.L3BlockHeader (json tags == field
// names) so auditors can recompute ChainHash / statements_root.
message L3BlockHeader {
  uint64 l3_block_seq = 1;
  string prev_l3_hash = 2;
  uint64 statement_seq_start = 3;
  uint32 statement_count = 4;
  string schema_snapshot_id = 5;
  string executor_profile_id = 6;
  string prev_safe_snapshot_id = 7;
  string prev_state_root = 8;
  string spent_ids_root_after = 9;
  // CanonicalDigest("arbiter-l3-statements-v1", []StatementEnvelope) over the
  // sealed block's envelopes in statement_seq order.
  string statements_root = 10;
  AnchorRef l2_anchor_ref = 11;
  // Set only on a singleton snapshot-query block: it repeats statements_root,
  // which for that lane is housegate's SnapshotQueryStatementRoot.
  string query_statement_root = 12;
  // Set only on a zero-statement table-set transition block (dynamic SI
  // table set, spec D7).
  TableSetTransition table_set_transition = 13;
  // The block's track (housegate spec 2026-10-10 §7.1): the SI indexer that
  // owns every statement, or every table change, of the block. Set on every
  // block sealed after the tracks activation and absent on every earlier one;
  // part of the ChainHash preimage (fsm json tag "track") only when set.
  // Headers are FSM state and never travel in a Raft command
  // (SealL3BlockCmd carries nothing); this field serves the read API.
  L3BlockTrack track = 14;
}

// TableSetAdd is one table a transition block brings into the SI state root,
// empty, under the schema hash its registry incarnation committed.
message TableSetAdd {
  string table_id = 1;
  string schema_hash = 2;
}

// TableSetTransition mirrors arbiter fsm.TableSetTransition (json tags ==
// field names): adds sorted by table_id, retires ascending, new_schema_root
// over the resulting table set. An empty list is absent from the ChainHash
// preimage (omitempty).
message TableSetTransition {
  repeated TableSetAdd adds = 1;
  repeated string retires = 2;
  string new_schema_root = 3;
}

// L3BlockTrack is a block header's track (spec §7.1): set on every block
// sealed after the tracks activation; message presence keeps indexer 0
// distinct from absent.
message L3BlockTrack {
  uint64 indexer_id = 1;
}

message L3BlockRef {
  uint64 l3_block_seq = 1;
}

message L3Block {
  L3BlockHeader header = 1;
  string chain_hash = 2;
  // Envelopes in statement_seq order (statement_seq_start .. +statement_count).
  repeated StatementEnvelopeV2 statements = 3;
}

enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  NODE_ROLE_VERIFIER = 1;
  NODE_ROLE_SNODE = 2;
}

// NodeRegistration enters a data-plane node into FSM membership (§4.1
// RegisterNode). Only MarkActive (snapshot-synced) nodes join the
// deterministic verifier-selection pool (§7.4).
message NodeRegistration {
  string node_id = 1;
  repeated NodeRole roles = 2;
  // ed25519 verify key for attestation/scan signatures (verifier role).
  bytes ed25519_pubkey = 3;
  // Advisory dial address, observability only — dispatch always rides
  // node-initiated subscribe streams (§11.1).
  string dial_addr = 4;
  // Capability strings of the registering binary ("client_lanes_v1",
  // "signed_claims_v1", "track_manifests_v1"). Request-only: the leader
  // records them in a non-replicated feature book and never copies them into
  // a RaftCommand or replicated state (housegate spec 2026-10-09 §5.6),
  // because a voter that does not know this field refuses every command that
  // carries it. After the tracks activation the leader refuses a data-plane
  // registration whose features lack "track_manifests_v1" (housegate spec
  // 2026-10-10 §7.6).
  repeated string features = 5;
  // The node's registration sequence (housegate spec 2026-10-10 §6.5): the
  // node persists it and raises it before every RegisterNode. After the
  // signed-claims activation it must exceed the last registration_seq applied
  // for node_id, so a replayed registration cannot push a running node back to
  // Syncing. Unlike features it is replicated, inside
  // RegisterNodeCmd.registration, and covered by the signature; the server
  // proposes 0 before the activation.
  uint64 registration_seq = 6;
  // SNODE role, after the signed-claims activation: ES256K compact JWS by the
  // signer of the si_indexers entry whose snode_node_id is node_id, purpose
  // "arbiter-snode-message-v1", kind "registration", over this registration
  // without features, signer_jws and ed25519_signature, bound to the network
  // id and genesis snapshot id. Request-only: the server moves it into
  // RegisterNodeCmd.signer_jws. Dropped before the activation.
  string signer_jws = 7;
  // VERIFIER role, after the signed-claims activation: hex ed25519 signature
  // by the node's verifiers-entry key (equal to ed25519_pubkey) over the
  // "registration" verifier-message hash of the same body and context.
  // Request-only: the server moves it into RegisterNodeCmd.ed25519_signature.
  // Dropped before the activation.
  string ed25519_signature = 8;
}

// NodeRef names one data-plane node. It is the MarkActive request and is
// never embedded in a RaftCommand.
message NodeRef {
  string node_id = 1;
  // After the signed-claims activation it must equal the last
  // registration_seq applied for node_id, binding this activation to that
  // registration (housegate spec 2026-10-10 §6.5). Copied into MarkActiveCmd;
  // 0 before the activation.
  uint64 registration_seq = 2;
  // SNODE, after the activation: ES256K compact JWS by the entry's signer,
  // purpose "arbiter-snode-message-v1", kind "mark_active", body {node_id,
  // registration_seq}. Copied into MarkActiveCmd.signer_jws.
  string signer_jws = 3;
  // VERIFIER, after the activation: hex ed25519 signature by the
  // verifiers-entry key over the "mark_active" verifier-message hash of the
  // same body. Copied into MarkActiveCmd.ed25519_signature. Both signatures
  // are dropped before the activation.
  string ed25519_signature = 4;
}

// Ack acknowledges an idempotent write; duplicates ack identically.
message Ack {}

// NotLeader is attached as a gRPC error detail (FAILED_PRECONDITION) by
// non-leader nodes on write-class RPCs; the client retries against
// leader_addr (§11.3).
message NotLeader {
  string leader_addr = 1;
}

// GetStatementStatusRequest queries one statement's local FSM view by flat
// statement_id ("account:seq:nonce"). Any node may serve it with bounded
// staleness under the SafeState read posture (§11.3).
message GetStatementStatusRequest {
  string statement_id = 1;
}

// StatementStatus is a point-in-time local FSM view. found=false means the
// statement was never sequenced on this cluster; it is not evidence of a
// terminal rejection. Callers converge by resending SubmitStatement.
message StatementStatus {
  bool found = 1;
  uint64 statement_seq = 2;
  // FSM status string: "Sequenced".."Safe" / "Rejected".
  string status = 3;
  bool rc_bound = 4;
  // The statement's assigned source when rc_bound.
  string bound_source = 5;
}

// ============================================================
// Services (§11.2). Leader-only for all write/dispatch RPCs; SafeState
// reads may be served by followers with bounded staleness or routed via
// read-index for linearizability (§11.3).
// ============================================================

// ArbiterIngress is called by HouseGate.
service ArbiterIngress {
  // Idempotency key: (statement_id.client_account, statement_id.client_seq).
  rpc SubmitStatement (StatementEnvelopeV2) returns (SequencedAck) {}
  // Read-only status probe for staged-intake convergence (housegate P1e).
  rpc GetStatementStatus (GetStatementStatusRequest) returns (StatementStatus) {}
  // New v3 lane; old SubmitStatement continues admitting only its old kinds.
  rpc AcquireSnapshotQuery (AcquireSnapshotQueryRequest) returns (SnapshotQueryReservation) {}
  rpc GetSnapshotQueryReservation (GetSnapshotQueryReservationRequest) returns (SnapshotQueryReservationStatus) {}
  rpc ReleaseSnapshotQuery (ReleaseSnapshotQueryRequest) returns (SnapshotQueryReservationStatus) {}
  rpc SubmitSnapshotQuery (SnapshotQueryEnvelope) returns (SnapshotQuerySubmitResult) {}
  rpc GetSnapshotQueryStatus (GetSnapshotQueryStatusRequest) returns (SnapshotQueryStatus) {}
}

// SourceClaims is called by the source SNode.
service SourceClaims {
  // Idempotency key: statement_id (same statement, same RC → same Ack).
  rpc RegisterResultClaim (RCRecord) returns (Ack) {}
  // Requires authenticated source identity matching the assigned source.
  rpc RegisterSnapshotQueryClaim (SnapshotQueryClaim) returns (Ack) {}
  // Requires the authenticated publisher role and a checked signature.
  rpc RecordSnapshotArtifactReady (SnapshotArtifactReadySubmission) returns (Ack) {}
}

// VerifierGateway is called by Verifiers (data plane dials in).
service VerifierGateway {
  // Leader dispatch stream: ReplayJob round, then ByteSideScanRequest round
  // (§7.1). A leader change breaks the stream; the verifier reconnects to
  // the new leader and the orchestrator re-dispatches from FSM state (§10.2).
  rpc SubscribeVerifierDispatch (VerifierHello) returns (stream VerifierDispatch) {}
  // Idempotency key: (replica_id, receipt.block_seq) — one vote per replica
  // per block (§10.3).
  rpc SubmitAttestation (ReplayAttestation) returns (Ack) {}
  rpc SubmitSnapshotQueryAttestation (SnapshotQueryAttestation) returns (Ack) {}
  // Idempotency key: (replica_id, block_seq).
  rpc SubmitByteSideScan (ByteSideScanMsg) returns (Ack) {}
}

// PromotionGateway is called by SNodes (data plane dials in).
service PromotionGateway {
  // Before the signed-claims activation every connected SNode receives every
  // promotion and cleanup; after it only the table owner's SNode does
  // (housegate spec 2026-10-10 §6.6).
  rpc SubscribePromotions (SNodeHello) returns (stream PromotionCommand) {}
  // Idempotency key: promotion_seq (per table/partition, §10.3).
  rpc AckPromotion (PromotionAck) returns (Ack) {}
  rpc AckCleanup (CleanupAck) returns (Ack) {}
  // A data-plane node (the source SNode or a verifier) reports that it dropped
  // its hg_* tables and Keeper replica for one Purging incarnation of the
  // dynamic SI table registry. Authenticated like AckCleanup: the node is named
  // by node_id and the FSM accepts only a registered, non-evicted SNode or
  // verifier; after the signed-claims activation the report also carries the
  // reporter's signature (RecordTablePurgedCmd.signer_jws for an SNode,
  // ed25519_signature for a verifier). Idempotent: an already-recorded node,
  // or an incarnation that is already Purged, returns Ack. FAILED_PRECONDITION
  // without a NotLeader detail means the incarnation is not Purging yet; the
  // caller retries and never reads it as success.
  rpc SubmitTablePurged (RecordTablePurgedCmd) returns (Ack) {}
}

// GetClientSeqStateRequest names one accumulator subject: the account alone
// for the legacy lane, account and lane for a client lane.
message GetClientSeqStateRequest {
  string client_account = 1;
  string client_lane = 2;
}

// ClientSeqRange is a closed range [start, end] of unspent client_seq values.
message ClientSeqRange {
  uint64 start = 1;
  uint64 end = 2;
}

// ClientSeqState is the serving voter's applied spent-id state of one subject:
// spent = [1, hi] minus ranges. A local read, not a consensus read.
message ClientSeqState {
  bool found = 1;
  string subject = 2;
  uint64 hi = 3;
  repeated ClientSeqRange ranges = 4;
}

// ============================================================
// Stage-3 reads (housegate spec 2026-10-14 §14, §15, §16 P0)
// ============================================================

// The messages below answer the three stage-3 SafeState reads: committed FSM
// state that the owner SNode's hg_safe audit (§14), member installs (§8) and
// shadow verification (§16 P2) need without a consensus change. The leader
// refuses a malformed request with INVALID_ARGUMENT before any log write and
// answers after exactly one leader read barrier; a follower answers
// FAILED_PRECONDITION with a NotLeader detail. No RaftCommand reaches any of
// them: they are never proposed, replicated or snapshotted.

// GetPartitionStatesRequest selects partitions of one SI table.
message GetPartitionStatesRequest {
  // Required (INVALID_ARGUMENT when empty): a safe-part entry is about 4.9 KB,
  // so the read is scoped to one table.
  string table_id = 1;
  // Empty selects every partition of table_id that the FSM holds state for:
  // a promotion base, a safe-part inventory or a promoted unsafe part.
  string partition_id = 2;
}

// PartitionStateEntry is one partition's committed promotion state.
message PartitionStateEntry {
  string table_id = 1;
  string partition_id = 2;
  // The base the partition's next PromoteSafePartition must name (arbiter
  // fsm.PartitionState). base_partition_root is "0x" + hex of the raw
  // 2048-byte LtHash accumulator, empty for the all-zero base of a partition
  // that was never promoted.
  string base_safe_snapshot_id = 3;
  string base_partition_root = 4;
  // promotion_seq of the applied acknowledgement that last advanced the
  // base, 0 when none. The owner audit's reference inventory is the newer,
  // by this number, of safe_parts and the SNode's own last acknowledged
  // inventory.
  uint64 publish_seq = 5;
  // The acknowledged hg_safe inventory: every active part the last applied
  // acknowledgement listed, in FSM order (the order manifests list them in).
  repeated PartManifestEntry safe_parts = 6;
  // part_row_lthash of every promoted candidate part whose hg_unsafe copy no
  // cleanup acknowledgement has removed yet, ascending.
  repeated string promoted_unsafe_part_row_lthashes = 7;
  // The newest unacknowledged promotion of this partition, 0 when none; a
  // partition no applied acknowledgement has reached is not listed at all.
  uint64 unacked_promotion_seq = 8;
  // The newest acknowledged promotion, applied or not, 0 when none.
  uint64 last_acked_promotion_seq = 9;
  // Diagnostic only (fsm.PartitionState.InventoryUnrefreshed): the physical
  // names of parts committed before the last acknowledgement were never
  // re-confirmed by a complete post-REPLACE inventory.
  bool inventory_unrefreshed = 10;
}

// PartitionStates answers SafeState.GetPartitionStates.
message PartitionStates {
  // The FSM's PromotionSeq at the read: the last issued promotion.
  uint64 promotion_seq = 1;
  // The published safe watermark at the read.
  SafeWatermark safe_watermark = 2;
  // Ascending by partition_id. Empty when the FSM holds no state for the
  // selection; an unknown table_id is not a refusal.
  repeated PartitionStateEntry partitions = 3;
}

// GetPromotionOutcomesRequest pages through issued promotions in ascending
// promotion_seq.
message GetPromotionOutcomesRequest {
  // Empty selects every table. partition_id needs table_id
  // (INVALID_ARGUMENT otherwise).
  string table_id = 1;
  string partition_id = 2;
  // Exclusive cursor: only promotions with a greater promotion_seq are
  // returned; 0 starts at the first.
  uint64 after_promotion_seq = 3;
  // Page size: 0 means 256; a value above 1024 is INVALID_ARGUMENT.
  uint32 limit = 4;
}

// PromotionOutcome is one issued promotion and what became of it (arbiter
// fsm.PendingPromotion, which the FSM keeps after its acknowledgement).
message PromotionOutcome {
  uint64 promotion_seq = 1;
  // The command as issued.
  PromoteSafePartition promote = 2;
  // The statements whose candidate parts it promotes, ascending.
  repeated uint64 statement_seqs = 3;
  // The highest L3 block of statement_seqs: the block the promotion belongs
  // to.
  uint64 block_seq = 4;
  // That block's track; absent for a block sealed before the tracks
  // activation.
  L3BlockTrack track = 5;
  // The SNode whose acknowledgement settles the promotion (the statements'
  // shared source); empty when the FSM cannot resolve one.
  string source_node = 6;
  // The authority JWS the promotion is dispatched with and the consensus
  // epoch it was issued in, to which that JWS is bound.
  string authority_jws = 7;
  uint64 authority_epoch = 8;
  // True once an acknowledgement settled the promotion, applied or not.
  bool acked = 9;
  // The settling acknowledgement as the FSM recorded it (Plan S2-A amendment
  // A35), applied or not: present only when it was recorded after the tracks
  // activation. Its source_jws is empty; the signature is ack_jws.
  PromotionAck ack = 10;
  // The SNode signature over ack (RecordPromotionAckCmd.source_jws) and the
  // consensus epoch the acknowledgement applied in; empty and 0 with ack.
  string ack_jws = 11;
  uint64 ack_epoch = 12;
  // A cleanup of this promotion's promoted hg_unsafe parts is scheduled and
  // not acknowledged yet.
  bool cleanup_pending = 13;
}

// PromotionOutcomes answers SafeState.GetPromotionOutcomes.
message PromotionOutcomes {
  // The FSM's PromotionSeq at the read: the last issued promotion.
  uint64 promotion_seq = 1;
  // At most limit outcomes, ascending by promotion_seq.
  repeated PromotionOutcome outcomes = 2;
  // The after_promotion_seq of the next page, 0 when this page is the last.
  uint64 next_after_promotion_seq = 3;
}

// StatementCandidates is one statement of a block with its bound result
// claim (arbiter fsm.StatementState and its RCRecord).
message StatementCandidates {
  uint64 statement_seq = 1;
  // Flat statement id (StatementID's string form).
  string statement_id = 2;
  // FSM status string (fsm.Status.String(), as in StatementStatus):
  // "Sequenced".."Safe", "ChallengeReplay" or "Rejected".
  string status = 3;
  // The source the statement is bound to, and whether its result claim is
  // bound.
  string source_node = 4;
  bool rc_bound = 5;
  // The bound claim's post-state root, candidate parts and per-partition
  // new-part sums (RCRecord fields 4, 3 and 5); empty until rc_bound.
  string source_claim_root = 6;
  repeated CandidatePart candidate_parts = 7;
  repeated PartitionLtHashSum partition_new_part_sums = 8;
  // part_row_lthash of every candidate part that no applied promotion has
  // promoted yet, ascending.
  repeated string unpromoted_part_row_lthashes = 9;
}

// VerifierEvidence is one selected verifier's recorded evidence for a block
// and, once the verdict is evaluated, its three-check outcome (arbiter
// fsm.ReplicaVerdict).
message VerifierEvidence {
  string replica_id = 1;
  // Absent until the verifier's replay attestation, respectively its
  // byte-side scan, is recorded.
  ReplayAttestation attestation = 2;
  ByteSideScanMsg byte_side_scan = 3;
  // True once the block's verdict holds an outcome for this verifier; the
  // four checks below are meaningful only then.
  bool evaluated = 4;
  bool check1_root_match = 5;
  bool check2_partition_match = 6;
  bool check3_byte_side_match = 7;
  bool pass = 8;
}

// BlockVerification answers SafeState.GetBlockVerification: what the leader
// dispatches for one sealed block and every piece of evidence the FSM
// recorded for it, so a shadow verifier can replay the block, scan its
// candidate parts and compare its outcome with the recorded one.
message BlockVerification {
  // The sealed header and its ChainHash, as GetL3Block returns them.
  L3BlockHeader header = 1;
  string chain_hash = 2;
  // The replay job exactly as the leader dispatches it to the verifiers.
  ReplayJob replay_job = 3;
  // The block's statements, in statement_seq order.
  repeated StatementCandidates statements = 4;
  // The parts of the block's byte-side scan request
  // (ByteSideScanRequest.parts), as the leader dispatches them.
  repeated PartRef scan_parts = 5;
  // The block's sources and its selected verifier set, as recorded.
  repeated string source_nodes = 6;
  repeated string verifier_set = 7;
  // One entry per verifier_set member, in verifier_set order.
  repeated VerifierEvidence evidence = 8;
  // True once the FSM evaluated the three-way verdict; quorum is meaningful
  // only then.
  bool verdict_evaluated = 9;
  bool quorum = 10;
  // The block's L2 anchor and its finality as RecordAnchorFinalityCmd
  // recorded them; absent and false until then.
  AnchorRef anchor = 11;
  bool finality = 12;
  bool last_mergeable = 13;
}

// SafeState serves read-only safe-state queries to HouseGate and clients.
service SafeState {
  rpc GetSafeWatermark (GetSafeWatermarkRequest) returns (SafeWatermark) {}
  rpc GetManifest (SnapshotRef) returns (SafeSnapshotManifest) {}
  // as_of_safe time-travel by SafeBlockSeq (§8.5).
  rpc GetManifestByBlock (BlockRef) returns (SafeSnapshotManifest) {}
  // Sealed L3 block header + envelopes for auditing statements_root / ChainHash.
  rpc GetL3Block (L3BlockRef) returns (L3Block) {}
  // Authenticated exact committed reads; missing records never imply publication.
  rpc GetPublishedSnapshot (GetPublishedSnapshotRequest) returns (PublishedSnapshot) {}
  rpc GetQueryPolicy (GetQueryPolicyRequest) returns (QueryPolicyStatus) {}
  // Local read of the serving voter's applied accumulator state for one
  // subject (operators and recovery tooling); no leader barrier.
  rpc GetClientSeqState (GetClientSeqStateRequest) returns (ClientSeqState) {}
  // Leader-barriered reads for stage 3 (housegate spec 2026-10-14 §14 owner audit, §8 installs, P2 shadow verification).
  rpc GetPartitionStates (GetPartitionStatesRequest) returns (PartitionStates) {}
  rpc GetPromotionOutcomes (GetPromotionOutcomesRequest) returns (PromotionOutcomes) {}
  rpc GetBlockVerification (L3BlockRef) returns (BlockVerification) {}
}

// Membership is called by SNodes / Verifiers.
service Membership {
  // After the signed-claims activation (housegate spec 2026-10-10 §6.5) only
  // an enrolled SNode (some si_indexers snode_node_id) or a listed verifier
  // may register, signed and with a rising registration_seq.
  rpc RegisterNode (NodeRegistration) returns (Ack) {}
  // MarkActive is accepted only after snapshot sync; Active nodes enter the
  // deterministic selection pools (§4.1, §7.4). After the signed-claims
  // activation it names the node's current registration_seq and is signed.
  rpc MarkActive (NodeRef) returns (Ack) {}
}

// Signed with purpose housegate-snapshot-query-control-v1.
// operation is acquire, lookup, or release; no client-selectable profile.
message SnapshotQueryControlBinding {
  string operation = 1;
  string network_id = 2;
  uint32 keeper_shard_id = 3;
  string client_account = 4;
  string statement_id = 5;
  string request_id = 6;
  string reservation_id = 7;
  uint64 fencing_generation = 8;
}

// The committed active policy selects both profiles. Identical requests are
// idempotent. A released/conflicting request fails with FAILED_PRECONDITION;
// callers recover authenticated terminal state through the status RPC.
message AcquireSnapshotQueryRequest {
  string network_id = 1;
  uint32 keeper_shard_id = 2;
  string client_account = 3;
  string statement_id = 4;
  string request_id = 5;
  string control_jws = 6;
}

// Authenticates lookup by request identity, optionally binding a known grant.
// Empty reservation_id and zero generation are allowed for request-only lookup.
message GetSnapshotQueryReservationRequest {
  string network_id = 1;
  uint32 keeper_shard_id = 2;
  string client_account = 3;
  string statement_id = 4;
  string request_id = 5;
  string control_jws = 6;
  string reservation_id = 7;
  uint64 fencing_generation = 8;
}

// Conditional cancellation: zero ID/generation cancels only an absent request.
// Draining cancellation binds the exact nonzero fence with no reservation ID.
// Consumed work can be resolved only by committed terminal authority.
message ReleaseSnapshotQueryRequest {
  string network_id = 1;
  uint32 keeper_shard_id = 2;
  string client_account = 3;
  string statement_id = 4;
  string request_id = 5;
  string control_jws = 6;
  string reservation_id = 7;
  uint64 fencing_generation = 8;
}

// The authenticated account/statement/root lookup is scoped to network/shard.
// Handlers require authenticated transport and leader/barrier committed reads.
message GetSnapshotQueryStatusRequest {
  string network_id = 1;
  uint32 keeper_shard_id = 2;
  string client_account = 3;
  string statement_id = 4;
  string expected_input_root = 5;
  // replay.DigestString (plain SHA-256) of the exact original compact JWS
  // bytes; never normalize or re-sign the token and never send it in this lookup.
  // The new-lane handler must require this hash and compare it to the committed
  // original JWS before returning accepted status. A mismatch is a conflict/refusal,
  // never found=false or success for an older differently signed submission.
  string expected_user_jws_hash = 6;
}

// Durable barrier state: idle, draining, granted, consumed, or resolving.
// Request status and released tombstones persist separately after the barrier idles.
message SnapshotBarrier {
  string state = 1;
  uint64 generation = 2;
  string request_id = 3;
  string client_account = 4;
  string statement_id = 5;
  SnapshotQueryReservation reservation = 6;
  uint64 block_seq = 7;
}

// The authenticated publisher signs the snapshot-query-artifact-ready-v1 hash.
// The record alone is not evidence of a signature-checked committed publication.
message SnapshotArtifactReadySubmission {
  SnapshotArtifactReady record = 1;
  string signature = 2;
}

// Selects one exact snapshot, never an implicit latest snapshot.
message GetPublishedSnapshotRequest {
  string network_id = 1;
  uint32 keeper_shard_id = 2;
  string snapshot_id = 3;
}

// Authenticated committed publication. Handlers use leader/barrier committed
// reads; consumers authenticate the serving authority. terminal_proof is opaque
// committed-record evidence whose encoding and verification are owned by C1.
// Empty proof cannot authorize success; missing data is never a negative proof.
message PublishedSnapshot {
  SafeSnapshotManifest manifest = 1;
  ActiveQueryPolicy activation = 2;
  SnapshotArtifactReadySubmission artifact_ready = 3;
  bytes terminal_proof = 4;
}

// Selects an exact activation ID or block, or both when they agree.
// A missing selector or unknown record never falls back to latest policy.
message GetQueryPolicyRequest {
  string network_id = 1;
  uint32 keeper_shard_id = 2;
  string activation_id = 3;
  uint64 block_seq = 4;
}

// Historical consensus policy, not permission to admit a historical profile.
// Handlers use leader/barrier committed reads; consumers authenticate the
// serving authority and C1 committed-record proof. Positive records require
// nonempty proof; negative/unknown is never inferred from missing data.
message QueryPolicyStatus {
  bool found = 1;
  ActiveQueryPolicy activation = 2;
  bytes terminal_proof = 3;
}

// Complete immutable artifact projection committed by artifact_set_root.
message SnapshotArtifactEntry {
  string table_id = 1;
  string partition_id = 2;
  string part_name = 3;
  string part_phys_hash = 4;
  string object_digest = 5;
  uint64 bytes = 6;
}

// Sorted complete artifact list plus schema artifact digest. No fetch hints.
message SnapshotArtifactSet {
  repeated SnapshotArtifactEntry parts = 1;
  string schema_artifact_digest = 2;
}
